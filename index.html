  auth.onAuthStateChanged(function(user){
    if(unsubEntries){ unsubEntries(); unsubEntries=null; }
    if(unsubUserDoc){ unsubUserDoc(); unsubUserDoc=null; }
    detachLifeListeners();

    if(user){
      state.user = {uid:user.uid, name:user.displayName||'You', email:user.email||'', photoURL:user.photoURL||''};
      state.entries = [];
      state.settings = null;
      state.life = {achievements:[],plans:[],quotes:[],ideas:[],lessons:[],challenges:[],moments:[],events:[],people:[],places:[]};
      syncProfileUI();

      const ref = userDocRef();
      ref.get().then(snap=>{
        if(!snap.exists){
          return ref.set({
            profile:{name:state.user.name, email:state.user.email, createdAt:new Date().toISOString()},
            settings: DEFAULT_SETTINGS
          });
        }
      }).catch(err=>console.error('user doc init failed', err));

      attachUserDocListener();
      attachEntriesListener();
      attachLifeListeners();
      seedDraftFromRemoteIfNeeded();
      showApp();
    } else {
      state.user = null;
      state.entries = [];
      state.settings = null;
      state.life = {achievements:[],plans:[],quotes:[],ideas:[],lessons:[],challenges:[],moments:[],events:[],people:[],places:[]};
      showAuth();
    }
  });
}
function showAuth(){
  document.getElementById('auth').style.display='flex';

/* Sidebar hover-tooltips: positioned via JS (not pure CSS) so the label is
   a position:fixed element placed next to the button's real on-screen
   location. This lets it escape the sidebar's own overflow box entirely —
   that overflow was previously clipping/hiding the tooltip — and guarantees
   it always paints above every other floating glass chip on the page. */
function initSidebarTooltips(){
  const sidebar = document.getElementById('sidebar');
  if(!sidebar) return;
  sidebar.querySelectorAll('.nav-item').forEach(item=>{
    const tip = item.querySelector('.tip');
    if(!tip) return;
    item.addEventListener('mouseenter', ()=>{
      const r = item.getBoundingClientRect();
      tip.style.top = (r.top + r.height/2) + 'px';
      tip.style.left = (r.right + 12) + 'px';
    });
  });
}

/* ---------------- Module: fixed floating write-toolbar show/hide on scroll ----------------
   The bar (populated inside renderWrite()) stays mounted at position:fixed. It is only
   switched "active" while the user is on the write/edit view, and within that view it
   slides in when the user scrolls UP and slides away when they scroll DOWN — so it never
   permanently blocks content, but is always one small scroll away. */
let __wfbLastY = 0;
function syncWriteFixedBarVisibility(){
  const wfb = document.getElementById('writeFixedBar');
  if(!wfb) return;
  if(state.view === 'write'){
    document.body.classList.add('write-mode');
    wfb.classList.add('active');
    wfb.classList.add('show'); // visible the moment you enter the editor
    __wfbLastY = window.scrollY || document.documentElement.scrollTop || 0;
  } else {
    document.body.classList.remove('write-mode');
    wfb.classList.remove('active');
    wfb.classList.remove('show');
  }
}
(function initWriteFixedBarScroll(){
  let ticking = false;
  window.addEventListener('scroll', function(){
    if(state.view !== 'write') return;
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      const wfb = document.getElementById('writeFixedBar');
      if(wfb){
        const y = window.scrollY || document.documentElement.scrollTop || 0;
        const delta = y - __wfbLastY;
        if(y < 40){
          wfb.classList.add('show'); // near the very top — keep it visible
        } else if(delta > 4){
          wfb.classList.remove('show'); // scrolling down (reading/writing further) — hide
        } else if(delta < -4){
          wfb.classList.add('show'); // scrolling up — reveal
        }
        __wfbLastY = y;
      }
      ticking = false;
    });
  }, {passive:true});
})();

function getStreak(){
  // Archived entries shouldn't unexpectedly inflate or break the streak —
  // only active journal days count.
  const dates = new Set(state.entries.filter(e=>!e.archived).map(e=>e.date));
  let streak = 0; let d = new Date();
  while(true){
    const iso = d.toISOString().slice(0,10);
    if(dates.has(iso)){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}

/* Module 04: Dashboard's own AI-summary loader. Reuses the existing
   generateDailySummary()/localDailySummary() (same Gemini-or-local
   architecture as the Write page) but adds a small in-memory cache keyed by
   entry id + updatedAt, so re-rendering the Dashboard (e.g. on every
   Firestore snapshot) never re-issues a Gemini call unless today's entry
   actually changed. */
let dashSummaryCache = {};
let dashAiToken = 0;
function refreshDashboardAISummary(){
  const today = todayISO();
  const entry = state.entries.find(e=>e.date===today && !e.archived);
  const el = document.getElementById('dashAiSummaryText');
  if(!el || !entry || !entry.content || entry.content.trim().length < 12) return; // nothing to summarize / section not on screen
  const noteEl = document.getElementById('dashAiSummaryNote');
  const cacheKey = entry.id || 'draft';
  const stamp = entry.updatedAt || entry.createdAt || entry.content;
  const cached = dashSummaryCache[cacheKey];
  if(cached && cached.stamp === stamp){
    el.textContent = cached.text;
    if(noteEl) noteEl.textContent = cached.note;
    return; // already have this entry's summary — no API call needed
  }
  const local = localDailySummary(entry);
  el.textContent = local;
  if(!state.settings || !state.settings.apiKey){
    const note = 'Settings-এ তোমার Gemini API key বসালে এখানে আসল AI summary দেখাবে।';
    if(noteEl) noteEl.textContent = note;
    dashSummaryCache[cacheKey] = {stamp, text: local, note};
    return;
  }
  if(noteEl) noteEl.textContent = 'Gemini থেকে সারাংশ আনা হচ্ছে…';
  const myToken = ++dashAiToken;
  generateDailySummary(entry).then(summary=>{
    if(myToken !== dashAiToken) return; // a newer call/navigation superseded this one
    const elNow = document.getElementById('dashAiSummaryText');
    const noteElNow = document.getElementById('dashAiSummaryNote');
    const usedAi = summary && summary !== local;
    const note = usedAi ? 'Gemini দিয়ে তৈরি সারাংশ।' : 'Gemini থেকে সারাংশ আনা যায়নি — local সারাংশ দেখানো হচ্ছে।';
    if(elNow) elNow.textContent = summary || local;
    if(noteElNow) noteElNow.textContent = note;
    dashSummaryCache[cacheKey] = {stamp, text: summary || local, note};
  });
}

/* ---------------- MODULE 02: lightweight formatting ---------------- */
function getContentTextarea(){ return document.getElementById('contentInput'); }
function wrapSelection(before, after){
  const ta = getContentTextarea(); if(!ta) return;
  const start = ta.selectionStart, end = ta.selectionEnd;
  const val = ta.value;
  const selected = val.slice(start,end) || 'text';
  ta.value = val.slice(0,start) + before + selected + after + val.slice(end);
  window.__draft.content = ta.value;
  ta.focus();
  ta.selectionStart = start + before.length;
  ta.selectionEnd = start + before.length + selected.length;
  updateWordCount(); refreshAIPreview(); scheduleAutosave();
}
function prefixLine(prefix){
  const ta = getContentTextarea(); if(!ta) return;
  const start = ta.selectionStart;
  const val = ta.value;
  const lineStart = val.lastIndexOf('\n', start-1)+1;
  ta.value = val.slice(0,lineStart) + prefix + val.slice(lineStart);
  window.__draft.content = ta.value;
  ta.focus();
  const newPos = start + prefix.length;
  ta.selectionStart = ta.selectionEnd = newPos;
  updateWordCount(); refreshAIPreview(); scheduleAutosave();
}
function insertLink(){
  const ta = getContentTextarea(); if(!ta) return;
  const url = prompt('লিংক (URL) দাও:');
  if(!url) return;
  const start = ta.selectionStart, end = ta.selectionEnd;
  const val = ta.value;
  const label = val.slice(start,end) || 'link';
  ta.value = val.slice(0,start) + `[${label}](${url})` + val.slice(end);
  window.__draft.content = ta.value;
  ta.focus();
  updateWordCount(); refreshAIPreview(); scheduleAutosave();
}
function inlineMd(s){
  return s
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer" style="color:var(--accent);">$1</a>');
}
function renderMarkdownLite(text){
  if(!text || !text.trim()) return '<p class="empty">এখনো কিছু লেখা হয়নি।</p>';
  const lines = escapeHtml(text).split(/\n/);
  let html=''; let inList=false;
  lines.forEach(line=>{
    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if(h){ if(inList){html+='</ul>';inList=false;} html += `<h4 style="margin:14px 0 6px;">${inlineMd(h[2])}</h4>`; return; }
    const li = line.match(/^[-*]\s+(.*)$/);
    if(li){ if(!inList){html+='<ul style="margin:6px 0;padding-left:20px;">';inList=true;} html += `<li>${inlineMd(li[1])}</li>`; return; }
    if(inList){ html+='</ul>'; inList=false; }
    html += line.trim()==='' ? '<br>' : `<p style="margin:0 0 10px;">${inlineMd(line)}</p>`;
  });
  if(inList) html+='</ul>';
  return html;
}
function togglePreview(){
  const ta = getContentTextarea();
  const btn = document.getElementById('previewToggleBtn');
  const existing = document.getElementById('contentPreview');
  if(existing){ existing.remove(); ta.style.display=''; btn.textContent='👁 Preview'; return; }
  const div = document.createElement('div');
  div.id = 'contentPreview'; div.className = 'content-preview';
  div.innerHTML = renderMarkdownLite(ta.value);
  ta.style.display = 'none';
  ta.insertAdjacentElement('afterend', div);
  btn.textContent = '✎ Edit';
}
function tagChip(t){ return `<span class="tag-chip">${escapeHtml(t)}<button onclick="removeTag('${escapeHtml(t)}')">×</button></span>`; }
function addTag(v){ v=v.trim(); if(!v) return; if(!window.__draft.tags.includes(v)) window.__draft.tags.push(v); rerenderTagWrap(); scheduleAutosave(); }
function removeTag(t){ window.__draft.tags = window.__draft.tags.filter(x=>x!==t); rerenderTagWrap(); scheduleAutosave(); }

let aiDebounce, aiCallToken = 0;
function refreshAIPreview(force){
  clearTimeout(aiDebounce);
  aiDebounce = setTimeout(async ()=>{
    const el = document.getElementById('aiPreview');
    if(!el) return;
    el.textContent = localDailySummary(window.__draft);
    if(!state.settings || !state.settings.apiKey) return;
    const myToken = ++aiCallToken;
    const noteEl = document.getElementById('aiNote');
    if(noteEl) noteEl.textContent = 'Gemini থেকে সারাংশ আনা হচ্ছে…';
    const summary = await generateDailySummary(window.__draft);
    if(myToken !== aiCallToken) return; // a newer call superseded this one
    const el2 = document.getElementById('aiPreview');
    if(el2) el2.textContent = summary;
    const noteEl2 = document.getElementById('aiNote');
    if(noteEl2) noteEl2.textContent = 'Gemini দিয়ে তৈরি সারাংশ।';
  }, force?0:400);

async function saveDraft(){
  const d = window.__draft;
  if(!d.content || !d.content.trim()){ toast('আগে কিছু লিখো।'); return; }
  try{
    if(d.id){
      const {id, ...data} = d;
      data.updatedAt = new Date().toISOString();
      await entriesColRef().doc(id).set(data, {merge:true});
    } else {
      d.createdAt = new Date().toISOString();
      d.updatedAt = d.createdAt;
      if(d.archived===undefined) d.archived = false;
      const {id, ...data} = d;
      const ref = await entriesColRef().add(data);
      d.id = ref.id;
    }
    state.editingId = d.id;
    clearLocalDraft();
    clearRemoteDraft();
    state.draftRecoveryResolved = true;
    state.appliedDraftData = null;
    toast('জার্নাল সংরক্ষিত হয়েছে।');
    // Module 06: re-run structured AI extraction in the background so the
    // journal (source of truth) is never blocked on the Life Organization update.
    runLifeExtraction({id:d.id, content:d.content, date:d.date}).catch(err=>console.error(err));
    go('dashboard');
  }catch(err){
    console.error(err);
    toast('সংরক্ষণ ব্যর্থ হয়েছে: ' + err.message);
  }
}

/* ---------------- FILTER ARCHITECTURE (Module 03) ----------------
   Predicate-based so future extracted-data filters (Achievement, Plan,
   Quote, Idea, Lesson, Person, Place, Event — Module 06/08+) can be added
   later just by pushing one more predicate here, without touching the
   filtering call sites or rebuilding this system. */
function buildFilterPredicates(f){
  const preds = [];
  if(f.archived==='active') preds.push(e=>!e.archived);
  else if(f.archived==='archived') preds.push(e=>!!e.archived);
  // f.archived==='all' -> no predicate, both included
  if(f.mood) preds.push(e=>e.mood===f.mood);
  if(f.tag) preds.push(e=>(e.tags||[]).includes(f.tag));
  if(f.favOnly) preds.push(e=>!!e.favorite);
  if(f.importantOnly) preds.push(e=>!!e.important);
  if(f.dateFrom) preds.push(e=>e.date >= f.dateFrom);
  if(f.dateTo) preds.push(e=>e.date <= f.dateTo);
  // Future category filters plug in here, e.g.:
  // if(f.category && f.categoryValue) preds.push(e=>(e.extracted && e.extracted[f.category]||[]).includes(f.categoryValue));
  return preds;
}
function applyFilters(entries, f){
  const preds = buildFilterPredicates(f);
  return entries.filter(e=>preds.every(p=>p(e)));
}
function isLibraryFiltered(f){
  return !!(f.mood || f.tag || f.favOnly || f.importantOnly || f.dateFrom || f.dateTo || f.archived!=='active');
}
function clearLibraryFilters(){
  state.filters = {mood:'',tag:'',favOnly:false, importantOnly:false, dateFrom:'', dateTo:'', archived:'active'};
  render();
}

    </div>
  `;
}

/* ---------------- CALENDAR (Module 06) ---------------- */
function renderCalendar(){
  const cur = state.calMonth;
  const year = cur.getFullYear(), month = cur.getMonth();
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const showArchived = state.calendarShowArchived;

  // Group by date instead of overwriting — a date can have more than one entry.
  const entriesByDate = {};
  state.entries.forEach(e=>{
    if(e.archived && !showArchived) return; // archived stays out of normal calendar activity unless explicitly shown
    (entriesByDate[e.date] = entriesByDate[e.date] || []).push(e);
  });
  window.__calEntriesByDate = entriesByDate; // read by openDayEntries()
  const today = todayISO();

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const dayEntries = entriesByDate[iso] || [];
    const isToday = iso===today;
    const hasImportant = dayEntries.some(e=>e.important);
    const allArchived = dayEntries.length>0 && dayEntries.every(e=>e.archived);

    let clickAttr = '', dotsHtml = '';
    if(dayEntries.length===1){
      const e = dayEntries[0];
      clickAttr = `onclick="go('write','${e.id}')"`;
      const op = (0.45 + ((e.moodIntensity||5)/10)*0.55).toFixed(2);
      dotsHtml = `<span class="cal-dot" style="background:${moodDotColor(e.mood)};opacity:${op}"></span>`;
    } else if(dayEntries.length>1){
      clickAttr = `onclick="openDayEntries('${iso}')"`;
      const mini = dayEntries.slice(0,3).map(e=>{
        const op = (0.45 + ((e.moodIntensity||5)/10)*0.55).toFixed(2);
        return `<span class="cal-dot-mini" style="background:${moodDotColor(e.mood)};opacity:${op}"></span>`;
      }).join('');
      dotsHtml = `<span class="cal-dot-row">${mini}${dayEntries.length>3?`<span class="cal-more">+${dayEntries.length-3}</span>`:''}</span>`;
    }

    cells += `<div class="cal-cell ${dayEntries.length?'has-entry':''} ${isToday?'today':''} ${allArchived?'has-archived':''}" ${clickAttr} ${dayEntries.length? `title="${dayEntries.length} entr${dayEntries.length>1?'ies':'y'}"`:''}>
      ${hasImportant?'<span class="cal-pin">📌</span>':''}
      <span>${day}</span>
      ${dotsHtml}
    </div>`;
  }
  const dows = ['Su','Mo','Tu','We','Th','Fr','Sa'];

  return `
    <div class="page-head">
      <h1>Calendar</h1>
      <label class="pill" style="cursor:pointer;">
        <input type="checkbox" ${showArchived?'checked':''} onchange="state.calendarShowArchived=this.checked; render();" style="margin:0;"> Show archived
      </label>
    </div>
    <div class="card">
      <div class="cal-head">
        <button class="btn btn-sm" onclick="shiftMonth(-1)">← Prev</button>
        <h3 style="margin:0;">${cur.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h3>
        <button class="btn btn-sm" onclick="shiftMonth(1)">Next →</button>
      </div>
      <div class="cal-grid">
        ${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
      <div class="cal-legend">
        ${MOODS.map(m=>`<span class="item"><span class="dot" style="background:${moodDotColor(m.id)}"></span>${m.emoji} ${m.label}</span>`).join('')}
        <span class="item">📌 Important</span>
        ${showArchived ? `<span class="item">┄ Archived-only day</span>` : ''}
      </div>
    </div>
  `;
}
function shiftMonth(n){
  state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth()+n, 1);
  render();
}

/* ---- Day popover: a date with 2+ entries opens a small list instead of
   silently jumping into (or hiding) just one of them. ---- */
function openDayEntries(iso){
  const entries = (window.__calEntriesByDate && window.__calEntriesByDate[iso]) || [];
  const titleEl = document.getElementById('dayEntriesTitle');
  if(titleEl) titleEl.textContent = fmtDate(iso, {weekday:'long', month:'long', day:'numeric', year:'numeric'});
  const listEl = document.getElementById('dayEntriesList');
  if(listEl){
    listEl.innerHTML = entries.map(e=>`
      <div class="entry-row" style="padding:10px 6px;" onclick="closeDayEntries(); go('write','${e.id}')">
        <div class="entry-body">
          <h3 style="font-size:14px;">${escapeHtml(e.title || 'Untitled')} ${e.important?'📌':''} ${e.archived?'<span class="archived-pill">🗄</span>':''}</h3>
          <p style="margin:0 0 6px;">${escapeHtml((e.content||'').slice(0,90))}${(e.content||'').length>90?'…':''}</p>
          <div class="entry-meta">
            <span class="mood-chip ${moodInfo(e.mood).cls}">${moodInfo(e.mood).emoji} ${moodInfo(e.mood).label}</span>
            <span class="intensity-tag">${e.moodIntensity||5}/10</span>
            ${e.favorite?'<span class="entry-star">★</span>':''}
          </div>
        </div>
      </div>
    `).join('');
  }
  document.getElementById('dayEntriesModal').classList.add('show');
}
function closeDayEntries(){ document.getElementById('dayEntriesModal').classList.remove('show'); }

/* ---------------- MODULE 06: LIFE ORGANIZATION — UI ----------------
   Life
   ├── Achievements / Plans / Quotes / Ideas / Lessons / Challenges  (renderLifeList)
   └── Memories
       ├── People / Places   (renderEntityLibrary — aggregate, cross-journal)
       └── Events / Important Moments   (renderLifeList)
   Every item card links back to its source journal (go('write', sourceEntryId)) —
   the journal is always reachable and always the source of truth. ---------------- */
function setLifeTab(key){ state.lifeTab = key; render(); }
function setMemoryTab(key){ state.memoryTab = key; render(); }
function getLifeFilter(type){
  if(!state.lifeFilters[type]) state.lifeFilters[type] = {search:'', category:'', status:'', favOnly:false};
  return state.lifeFilters[type];
}
function setLifeFilter(type, field, val){ getLifeFilter(type)[field] = val; render(); }
function clearLifeFilter(type){ state.lifeFilters[type] = {search:'', category:'', status:'', favOnly:false}; render(); }
function isLifeFiltered(f){ return !!(f.search || f.category || f.status || f.favOnly); }

function renderLifeHub(){
  const tab = state.lifeTab || 'achievements';
  return `
    <div class="page-head">
      <div><h1>Life</h1><div class="sub">তোমার জার্নাল থেকে AI যা খুঁজে পেয়েছে — সবই মূল জার্নালের সাথে যুক্ত, কখনো এর বাইরের কিছু বানানো হয় না।</div></div>
      ${!(state.settings && state.settings.apiKey) ? `<button class="btn btn-sm btn-ghost" onclick="go('settings')">⚙️ Gemini API key লাগবে</button>` : ''}
    </div>
    <div class="filter-row" style="margin-bottom:14px;">
      ${LIFE_TABS.map(t=>`<button class="btn btn-sm ${tab===t.key?'btn-primary':'btn-ghost'}" onclick="setLifeTab('${t.key}')">${t.icon} ${t.label}</button>`).join('')}
    </div>
    ${tab==='memories' ? renderMemoriesSection() : renderLifeList(tab)}
  `;
}
function renderMemoriesSection(){
  const tab = state.memoryTab || 'people';
  return `
    <div class="filter-row" style="margin-bottom:14px;">
      ${MEMORY_TABS.map(t=>`<button class="btn btn-sm ${tab===t.key?'btn-accent':'btn-ghost'}" onclick="setMemoryTab('${t.key}')">${t.icon} ${t.label}</button>`).join('')}
    </div>
    ${tab==='people' ? renderEntityLibrary('people') : tab==='places' ? renderEntityLibrary('places') : renderLifeList(tab)}
  `;
}

function renderLifeList(type){
  const cfg = LIFE_TYPES[type] || {};
  const f = getLifeFilter(type);
  let items = (state.life[type]||[]).slice();
  if(f.search){ const q=f.search.toLowerCase(); items = items.filter(x=>((x.text||x.title||'')+' '+(x.context||'')+' '+(x.reason||'')).toLowerCase().includes(q)); }
  if(f.category) items = items.filter(x=>x.category===f.category);
  if(f.status) items = items.filter(x=>x.status===f.status);
  if(f.favOnly) items = items.filter(x=>!!x.favorite);
  items.sort((a,b)=>{
    const ad = (type==='plans'&&a.plannedDate) || (type==='events'&&a.date) || a.sourceDate || '';
    const bd = (type==='plans'&&b.plannedDate) || (type==='events'&&b.date) || b.sourceDate || '';
    return bd.localeCompare(ad) || (b.createdAt||'').localeCompare(a.createdAt||'');
  });

  return `
    <div class="filter-row">
      <input type="text" placeholder="খুঁজুন…" value="${escapeHtml(f.search)}" oninput="setLifeFilter('${type}','search',this.value)" style="min-width:160px;">
      ${cfg.categories ? `<select onchange="setLifeFilter('${type}','category',this.value)">
        <option value="">All categories</option>
        ${cfg.categories.map(c=>`<option value="${c}" ${f.category===c?'selected':''}>${c}</option>`).join('')}
      </select>` : ''}
      ${cfg.statuses ? `<select onchange="setLifeFilter('${type}','status',this.value)">
        <option value="">All statuses</option>
        ${cfg.statuses.map(c=>`<option value="${c}" ${f.status===c?'selected':''}>${c}</option>`).join('')}
      </select>` : ''}
      ${cfg.hasFavorite ? `<label class="pill" style="cursor:pointer;"><input type="checkbox" ${f.favOnly?'checked':''} onchange="setLifeFilter('${type}','favOnly',this.checked)" style="margin:0;"> Favorites</label>` : ''}
      ${isLifeFiltered(f) ? `<button class="btn btn-ghost btn-sm" onclick="clearLifeFilter('${type}')">Clear filters</button>` : ''}
    </div>
    <div class="card">
      ${items.length ? items.map(x=>renderLifeCard(type,x,cfg)).join('') : `<div class="empty">এখনো কিছু পাওয়া যায়নি। যত বেশি লিখবে, তত বেশি এখানে যুক্ত হবে।</div>`}
    </div>
  `;
}
function renderLifeCard(type, item, cfg){
  const dateForDisplay = type==='plans' ? (item.plannedDate||'') : type==='events' ? (item.date||'') : (item.sourceDate||'');
  const mainText = type==='events' ? item.title : item.text;
  return `
    <div class="entry-row" style="cursor:default;">
      <div class="entry-date">
        ${dateForDisplay ? `<div class="d">${new Date(dateForDisplay+'T00:00:00').getDate()}</div><div class="m">${fmtDate(dateForDisplay,{month:'short'})}</div>` : `<div class="m" style="padding-top:8px;">—</div>`}
      </div>
      <div class="entry-body">
        <h3>${escapeHtml(mainText||'')} ${item.favorite?'<span class="entry-star">★</span>':''}</h3>
        ${item.context ? `<p>${escapeHtml(item.context)}</p>` : ''}
        ${item.reason ? `<p>${escapeHtml(item.reason)}</p>` : ''}
        ${type==='events' && (item.relatedPeople||[]).length ? `<p style="margin:0 0 6px;color:var(--ink-faint);font-size:12.5px;">👥 ${item.relatedPeople.map(escapeHtml).join(', ')}</p>` : ''}
        ${type==='events' && item.relatedPlace ? `<p style="margin:0 0 6px;color:var(--ink-faint);font-size:12.5px;">📍 ${escapeHtml(item.relatedPlace)}</p>` : ''}
        <div class="entry-meta">
          ${item.category ? `<span class="tag">${escapeHtml(item.category)}</span>` : ''}
          ${item.status ? `<span class="pill">${escapeHtml(item.status)}</span>` : ''}
          ${type==='plans' && item.plannedDate ? `<span class="intensity-tag">Planned: ${fmtDate(item.plannedDate)}</span>` : ''}
          ${item.sourceEntryId ? `<span class="tag" style="cursor:pointer;" onclick="go('write','${item.sourceEntryId}')">📓 Source · ${item.sourceDate?fmtDate(item.sourceDate):''}</span>` : ''}
        </div>
      </div>
      <div style="display:flex;gap:6px;flex-direction:column;flex:none;">
        ${cfg && cfg.hasFavorite ? `<button class="btn btn-sm" onclick="toggleLifeFavorite('${type}','${item.id}')">${item.favorite?'★':'☆'}</button>` : ''}
        <button class="btn btn-sm" onclick="openLifeEdit('${type}','${item.id}')">Edit</button>
        <button class="btn btn-sm btn-danger" onclick="deleteLifeItem('${type}','${item.id}')">Delete</button>
      </div>
    </div>
  `;
}
// People/Places aggregate across journals, so they get their own list view —
// each entity links out to every journal that mentions it.
function renderEntityLibrary(type){
  const f = getLifeFilter(type);
  let items = (state.life[type]||[]).slice();
  if(f.search){ const q=f.search.toLowerCase(); items = items.filter(x=>(x.name||'').toLowerCase().includes(q)); }
  items.sort((a,b)=>(b.lastMentioned||'').localeCompare(a.lastMentioned||''));
  const label = type==='people' ? 'কোনো ব্যক্তি' : 'কোনো স্থান';
  return `
    <div class="filter-row">
      <input type="text" placeholder="নাম খুঁজুন…" value="${escapeHtml(f.search)}" oninput="setLifeFilter('${type}','search',this.value)" style="min-width:160px;">
      ${f.search ? `<button class="btn btn-ghost btn-sm" onclick="clearLifeFilter('${type}')">Clear filters</button>` : ''}
    </div>
    <div class="card">
      ${items.length ? items.map(p=>`
        <div class="entry-row" style="cursor:default;align-items:flex-start;">
          <div class="entry-date"><div class="d" style="font-size:20px;">${type==='people'?'🧑':'📍'}</div></div>
          <div class="entry-body">
            <h3>${escapeHtml(p.name)}</h3>
            <div class="entry-meta">
              <span class="tag">First: ${p.firstMentioned?fmtDate(p.firstMentioned):'—'}</span>
              <span class="tag">Latest: ${p.lastMentioned?fmtDate(p.lastMentioned):'—'}</span>
              <span class="pill">${(p.sourceEntryIds||[]).length} journal${(p.sourceEntryIds||[]).length===1?'':'s'}</span>
            </div>
            ${(p.sourceEntryIds||[]).length ? `<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;">
              ${(p.sourceEntryIds||[]).slice(0,10).map(id=>{
                const e = state.entries.find(en=>en.id===id);
                return e ? `<span class="tag" style="cursor:pointer;" onclick="go('write','${id}')">📓 ${fmtDate(e.date)}</span>` : '';
              }).join('')}
            </div>` : ''}
          </div>
          <div style="display:flex;gap:6px;flex-direction:column;flex:none;">
            <button class="btn btn-sm btn-danger" onclick="deleteLifeItem('${type}','${p.id}')">Delete</button>
          </div>
        </div>
      `).join('') : `<div class="empty">এখনো ${label} শনাক্ত হয়নি।</div>`}
    </div>
  `;
}

function toggleLifeFavorite(type, id){
  const item = (state.life[type]||[]).find(x=>x.id===id);
  if(!item) return;
  lifeColRef(type).doc(id).set({favorite: !item.favorite, updatedAt:new Date().toISOString()}, {merge:true})
    .catch(err=>{ console.error(err); toast('আপডেট ব্যর্থ হয়েছে: ' + err.message); });
}
function deleteLifeItem(type, id){
  confirmAction('এই আইটেমটি মুছে ফেলবেন?', 'এটি শুধু এই Life আইটেমটি মুছবে — তোমার মূল জার্নাল এন্ট্রি অপরিবর্তিত ও নিরাপদে থাকবে।', async ()=>{
    try{
      await lifeColRef(type).doc(id).delete();
      toast('মুছে ফেলা হয়েছে।');
    }catch(err){ console.error(err); toast('মুছে ফেলা ব্যর্থ হয়েছে: ' + err.message); }
  }, 'মুছে ফেলুন');
}

let __lifeEditCtx = null;
function openLifeEdit(type, id){
  const item = (state.life[type]||[]).find(x=>x.id===id);
  if(!item) return;
  __lifeEditCtx = {type, id};
  const cfg = LIFE_TYPES[type] || {};
  const mainField = type==='events' ? 'title' : 'text';
  let fields = `<div class="field"><label>${type==='events'?'Title':'Text'}</label><textarea id="lifeEditMain" rows="3">${escapeHtml(item[mainField]||'')}</textarea></div>`;
  if(cfg.categories){
    fields += `<div class="field"><label>Category</label><select id="lifeEditCategory">
      <option value="">—</option>
      ${cfg.categories.map(c=>`<option value="${c}" ${item.category===c?'selected':''}>${c}</option>`).join('')}
    </select></div>`;
  }
  if(cfg.statuses){
    fields += `<div class="field"><label>Status</label><select id="lifeEditStatus">
      ${cfg.statuses.map(c=>`<option value="${c}" ${item.status===c?'selected':''}>${c}</option>`).join('')}
    </select></div>`;
  }
  if(type==='plans') fields += `<div class="field"><label>Planned date</label><input type="date" id="lifeEditPlannedDate" value="${item.plannedDate||''}"></div>`;
  if(type==='lessons') fields += `<div class="field"><label>Context</label><input type="text" id="lifeEditContext" value="${escapeHtml(item.context||'')}"></div>`;
  if(type==='moments') fields += `<div class="field"><label>Reason</label><input type="text" id="lifeEditReason" value="${escapeHtml(item.reason||'')}"></div>`;
  if(type==='events') fields += `<div class="field"><label>Date</label><input type="date" id="lifeEditDate" value="${item.date||''}"></div>`;
  document.getElementById('lifeEditFields').innerHTML = fields;
  document.getElementById('lifeEditModal').classList.add('show');
}
function closeLifeEdit(){ document.getElementById('lifeEditModal').classList.remove('show'); __lifeEditCtx = null; }
async function saveLifeEdit(){
  if(!__lifeEditCtx) return;
  const {type, id} = __lifeEditCtx;
  const cfg = LIFE_TYPES[type] || {};
  const mainField = type==='events' ? 'title' : 'text';
  const mainEl = document.getElementById('lifeEditMain');
  const mainVal = (mainEl ? mainEl.value : '').trim();
  if(!mainVal){ toast('খালি রাখা যাবে না।'); return; }
  const data = {[mainField]: mainVal, updatedAt: new Date().toISOString()};
  if(cfg.categories){ const el=document.getElementById('lifeEditCategory'); if(el) data.category = el.value || null; }
  if(cfg.statuses){ const el=document.getElementById('lifeEditStatus'); if(el) data.status = el.value; }
  if(type==='plans'){ const el=document.getElementById('lifeEditPlannedDate'); if(el) data.plannedDate = el.value || ''; }
  if(type==='lessons'){ const el=document.getElementById('lifeEditContext'); if(el) data.context = el.value || ''; }
  if(type==='moments'){ const el=document.getElementById('lifeEditReason'); if(el) data.reason = el.value || ''; }
  if(type==='events'){ const el=document.getElementById('lifeEditDate'); if(el) data.date = el.value || ''; }
  try{
    await lifeColRef(type).doc(id).set(data, {merge:true});
    toast('সংরক্ষণ হয়েছে।');
    closeLifeEdit();
  }catch(err){ console.error(err); toast('সংরক্ষণ ব্যর্থ হয়েছে: ' + err.message); }
}

/* ---------------- SEARCH (Module 21 — basic) ---------------- */
function renderSearch(){
  return `
    <div class="page-head"><h1>Search</h1></div>
    <div class="search-hero" style="margin-bottom:20px;">
      <input id="searchInput" type="text" placeholder="Search by word, title, tag, or mood…" oninput="doSearch(this.value)" autofocus>
    </div>
    <div id="searchResults">
      <div class="search-empty"><div class="mark serif">”</div>খোঁজার জন্য কিছু টাইপ করো।<br><span style="font-size:12px;">Semantic / AI search ভবিষ্যতে AI API কনফিগার করার পর যুক্ত হবে।</span></div>
    </div>
  `;
}
function doSearch(q){
  const box = document.getElementById('searchResults');
  q = q.trim().toLowerCase();
  if(!q){ box.innerHTML = `<div class="search-empty"><div class="mark serif">”</div>খোঁজার জন্য কিছু টাইপ করো।</div>`; return; }
  const results = state.entries.filter(e=>{
    if(e.archived) return false;
    return (e.title||'').toLowerCase().includes(q) ||
           (e.content||'').toLowerCase().includes(q) ||
           (e.tags||[]).some(t=>t.toLowerCase().includes(q)) ||
           moodInfo(e.mood).label.toLowerCase().includes(q) ||
           e.date.includes(q);
  }).sort((a,b)=>b.date.localeCompare(a.date));
  box.innerHTML = results.length ? `<div class="card">${results.map(e=>`
    <div class="entry-row" onclick="go('write','${e.id}')">
      <div class="entry-date"><div class="d">${new Date(e.date+'T00:00:00').getDate()}</div><div class="m">${fmtDate(e.date,{month:'short'})}</div></div>

/* ================================================================
   MODULE 07 — INSIGHTS PAGE (rewritten)
   Overview / Writing / Mood / Life sections are 100% local, instant,
   and always correct — no AI required. AI Insights (reflections +
   patterns) are a separate cached section with explicit status and
   a manual Regenerate action; they are never auto-called on render.

const INSIGHTS_TABS = [
  {key:'overview', label:'Overview'},
  {key:'writing', label:'Writing'},
  {key:'mood', label:'Mood'},
  {key:'life', label:'Life'},
  {key:'ai', label:'AI Insights'}
];
function setInsightsPeriod(key){ state.insightsPeriod = key; render(); }
function setInsightsTab(key){ state.insightsTab = key; render(); }

function trendBadge(pct){
  if(pct===null || pct===undefined) return '';
  if(pct>0) return `<span class="trend-badge trend-up">↑ ${pct}%</span>`;
  if(pct<0) return `<span class="trend-badge trend-down">↓ ${Math.abs(pct)}%</span>`;
  return `<span class="trend-badge trend-flat">— 0%</span>`;
}
function periodLabel(key){ return (PERIODS.find(p=>p.key===key)||{}).label || key; }
function bucketLabel(key, granularity){
  if(granularity==='month') return new Date(key+'-01T00:00:00').toLocaleDateString('en-US',{month:'short',year:'2-digit'});
  if(granularity==='week') return fmtDate(key,{month:'short',day:'numeric'});
  return fmtDate(key,{day:'numeric'});
}

function renderMiniChart(points, granularity, valueKey){
  if(!points.length) return `<div class="empty">এই সময়ে কোনো লেখা নেই।</div>`;
  const max = Math.max(1, ...points.map(p=>p[valueKey]||0));
  const showEvery = points.length>14 ? Math.ceil(points.length/7) : 1;
  return `
    <div class="mini-chart">
      ${points.map(p=>{
        const h = Math.max(2, Math.round(((p[valueKey]||0)/max)*84));
        const isHi = (p[valueKey]||0) === max && max>0;
        return `<div class="col" title="${bucketLabel(p.key,granularity)}: ${p[valueKey]||0}"><div class="b ${isHi?'hi':''}" style="height:${h}px;"></div></div>`;
      }).join('')}
    </div>
    <div class="mini-chart-labels">
      ${points.map((p,i)=> (i%showEvery===0 || i===points.length-1) ? `<span>${bucketLabel(p.key,granularity)}</span>` : '<span></span>').join('')}
    </div>`;
}

/* ---- AI Insights tab: weekly/monthly/yearly reflections + patterns ---- */
function renderInsightsAI(a){
  const noKey = !(state.settings && state.settings.apiKey);
  const weeklyId = weeklyPeriodId(new Date());
  const monthlyId = monthlyPeriodId(new Date());
  const yearlyId = yearlyPeriodId(new Date().getFullYear());
  // kick off (idempotent) background loads of cached docs the first time each renders
  ['weekly','monthly','yearly'].forEach(kind=>{
    const id = kind==='weekly'?weeklyId:kind==='monthly'?monthlyId:yearlyId;
    if(state.analysisCache[id]===undefined){ state.analysisCache[id]=null; loadCachedAnalysis(id).then(()=>{ if(state.view==='insights' && state.insightsTab==='ai') render(); }); }
  });
  if(state.patternsCache===null && state.user){
    state.patternsCache = undefined; // mark "loading" so we don't refetch every render
    patternsDocRef().get().then(doc=>{
      state.patternsCache = doc.exists ? doc.data() : {status:'idle'};
      if(state.view==='insights' && state.insightsTab==='ai') render();
    }).catch(()=>{ state.patternsCache = {status:'idle'}; });
  }

  return `
    ${noKey ? `<div class="card" style="margin-bottom:16px;"><div class="empty">Settings-এ Gemini API key যোগ করলে এখানে weekly/monthly/yearly AI reflection এবং pattern detection দেখতে পাবে। <button class="btn btn-sm" onclick="go('settings')" style="margin-left:6px;">⚙️ Settings</button></div></div>` : ''}
    ${renderReflectionCard('weekly', 'সাপ্তাহিক Reflection', weeklyId)}
    ${renderReflectionCard('monthly', 'মাসিক Reflection', monthlyId)}
    ${renderReflectionCard('yearly', 'বাৎসরিক Reflection', yearlyId)}
    ${renderPatternsCard()}
  `;
}
function statusBadge(status){
  const map = {ready:['ready','Ready'], generating:['generating','Generating…'], failed:['failed','Failed'], idle:['','Not generated']};
  const [cls,label] = map[status] || map.idle;
  return `<span class="ai-status-badge ${cls}">${label}</span>`;
}
function renderReflectionCard(kind, title, periodId){
  const cached = state.analysisCache[periodId];
  const status = cached ? cached.status : 'idle';
  return `
    <div class="card ins-section">
      <div class="ins-section-head">
        <h2>${title}</h2>
        <button class="btn btn-sm" onclick="runReflection('${kind}')" ${status==='generating'?'disabled':''}>↻ Regenerate</button>
      </div>
      <div class="ai-status-row">${statusBadge(status)}${cached && cached.generatedAt ? `<span style="font-size:11px;color:var(--ink-faint);">তৈরি: ${timeAgo(cached.generatedAt)}</span>` : ''}</div>
      ${status==='ready' ? `<div class="ai-reflect">${formatReflectionText(cached.text)}</div>`
        : status==='failed' ? `<div class="empty">${cached.reason==='no-key' ? 'AI key নেই।' : cached.reason==='no-data' ? 'এই সময়ে যথেষ্ট জার্নাল নেই।' : 'তৈরি করা যায়নি — আবার চেষ্টা করো।'}</div>`
        : status==='generating' ? `<div class="empty">তৈরি হচ্ছে…</div>`
        : `<div class="empty">No AI analysis yet. "Regenerate" চাপো।</div>`}
    </div>`;
}
function formatReflectionText(text){
  if(!text) return '';
  // turns "## Heading" markdown-lite lines into styled h4s, rest into paragraphs
  const lines = text.split(/\n+/);
  let out = '';
  lines.forEach(line=>{
    const t = line.trim(); if(!t) return;
    const h = t.match(/^#{1,3}\s*(.+)$/);
    if(h) out += `<h4>${escapeHtml(h[1])}</h4>`;
    else out += `<p>${escapeHtml(t)}</p>`;
  });
  return out;
}
async function runReflection(kind){
  const now = new Date();
  let periodId, start, end, entries, label;
  if(kind==='weekly'){
    periodId = weeklyPeriodId(now);
    end = now; start = new Date(now); start.setDate(start.getDate()-6); start.setHours(0,0,0,0);
    entries = entriesInRange(state.entries.filter(e=>!e.archived), start, end);
    label = 'এই সপ্তাহের';
  } else if(kind==='monthly'){
    periodId = monthlyPeriodId(now);
    start = new Date(now.getFullYear(), now.getMonth(), 1);
    end = new Date(now.getFullYear(), now.getMonth()+1, 0, 23,59,59);
    entries = entriesInRange(state.entries.filter(e=>!e.archived), start, end);
    label = 'এই মাসের';
  } else {
    periodId = yearlyPeriodId(now.getFullYear());
    start = new Date(now.getFullYear(),0,1); end = new Date(now.getFullYear(),11,31,23,59,59);
    entries = entriesInRange(state.entries.filter(e=>!e.archived), start, end);
    label = 'এই বছরের';
  }
  render(); // show "generating" immediately if already on this tab (status set inside generatePeriodReflection)
  await generatePeriodReflection(kind, periodId, start, end, entries, label);
  if(state.view==='insights' && state.insightsTab==='ai') render();
}
function renderPatternsCard(){
  const cached = state.patternsCache;
  const status = cached ? cached.status : 'idle';
  return `
    <div class="card ins-section">
      <div class="ins-section-head">
        <h2>Detected Patterns</h2>
        <button class="btn btn-sm" onclick="runPatterns()" ${status==='generating'?'disabled':''}>↻ Regenerate</button>
      </div>
      <div class="ai-status-row">${statusBadge(status)}${cached && cached.generatedAt ? `<span style="font-size:11px;color:var(--ink-faint);">তৈরি: ${timeAgo(cached.generatedAt)}</span>` : ''}</div>
      ${status==='ready' ? (cached.patterns.length ? cached.patterns.map(renderPatternItem).join('') : `<div class="empty">এখনো কোনো স্পষ্ট প্যাটার্ন পাওয়া যায়নি।</div>`)
        : status==='failed' ? `<div class="empty">${cached.reason==='no-key' ? 'AI key নেই।' : cached.reason==='no-data' ? 'প্যাটার্ন খুঁজতে আরও জার্নাল দরকার (কমপক্ষে ৩টি)।' : 'তৈরি করা যায়নি — আবার চেষ্টা করো।'}</div>`
        : status==='generating' ? `<div class="empty">প্যাটার্ন খোঁজা হচ্ছে…</div>`
        : `<div class="empty">No AI analysis yet. "Regenerate" চাপো।</div>`}
    </div>`;
}
function renderPatternItem(p){
  const confCls = p.confidence==='High'?'conf-high':p.confidence==='Medium'?'conf-medium':'conf-low';
  return `
    <div class="pattern-card">
      <div class="pattern-head"><h4>${escapeHtml(p.title)}</h4><span class="conf-badge ${confCls}">${p.confidence}</span></div>

      ${p.sourceDates.length ? `<div class="pattern-sources">

        }).join('')}
      </div>` : ''}
    </div>`;
}
async function runPatterns(){
  render();
  await generatePatterns();
  if(state.view==='insights' && state.insightsTab==='ai') render();
}

function shiftInsightsYear(n){ state.insightsYear += n; render(); }

function computeMonthAnalytics(d){
  const start = new Date(d.getFullYear(), d.getMonth(), 1);
  const end = new Date(d.getFullYear(), d.getMonth()+1, 0, 23,59,59,999);
  const activeEntries = state.entries.filter(e=>!e.archived);
  const inMonth = entriesInRange(activeEntries, start, end);
  const core = computeCoreStats(inMonth);
  const life = lifeCountsInRange(start, end);
  return {start, end, entries:inMonth, core, life};
}
function computeYearAnalytics(year){
  const start = new Date(year,0,1);
  const end = new Date(year,11,31,23,59,59,999);
  const activeEntries = state.entries.filter(e=>!e.archived);
  const inYear = entriesInRange(activeEntries, start, end);
  const core = computeCoreStats(inYear);
  const life = lifeCountsInRange(start, end);
  const trend = activityTrend(inYear, '1y');
  const mTrend = moodTrend(inYear, '1y');
  return {start, end, entries:inYear, core, life, trend, mTrend};
}

function setTheme(dark){
  const s = {...(state.settings||DEFAULT_SETTINGS), theme: dark?'dark':'light'};
  document.documentElement.setAttribute('data-theme', s.theme); // instant feedback; listener will confirm
  saveUserSettings(s);
}
function saveSettingField(field, val){
  const s = {...(state.settings||DEFAULT_SETTINGS), [field]: val};
  saveUserSettings(s);
}
// Merges a single Dashboard-section toggle into the existing settings doc
// (rather than overwriting the whole dashboardSections object), and syncs
// through the same Firestore user-settings architecture as every other
// preference, so it follows the user across devices/refreshes.
function saveDashboardSection(key, val){
  const current = (state.settings && state.settings.dashboardSections) || DEFAULT_SETTINGS.dashboardSections;
  const s = {...(state.settings||DEFAULT_SETTINGS), dashboardSections: {...current, [key]: val}};
  saveUserSettings(s);
}
function wipeAll(){
  confirmAction('সব ডেটা মুছে ফেলবেন?', 'এই অ্যাকাউন্টের সব জার্নাল এন্ট্রি ও সেটিংস Firebase থেকে স্থায়ীভাবে মুছে যাবে। এটি ফেরানো যাবে না।', async ()=>{
    try{
      const colNames = ['entries', ...LIFE_COLLECTIONS];
      for(const name of colNames){
        const snap = await userDocRef().collection(name).get();
        if(snap.empty) continue;
        const batch = db.batch();
        snap.docs.forEach(d=>batch.delete(d.ref));
        await batch.commit();
      }
      await userDocRef().delete();
      toast('ডেটা মুছে ফেলা হয়েছে।');
      auth.signOut();
    }catch(err){
      console.error(err);
      toast('মুছে ফেলা ব্যর্থ হয়েছে: ' + err.message);
    }
  }, 'সব মুছে ফেলুন');
}

/* ---------------- UTIL: toast + confirm modal ---------------- */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function confirmAction(title, body, onConfirm, confirmLabel){
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmBody').textContent = body;
  const btn = document.getElementById('confirmBtn');
  btn.textContent = confirmLabel || 'নিশ্চিত করুন';
  const modal = document.getElementById('confirmModal');
  modal.classList.add('show');
  btn.onclick = ()=>{ modal.classList.remove('show'); onConfirm(); };
}
function closeConfirm(){ document.getElementById('confirmModal').classList.remove('show'); }
