<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JournalOS — Write First. Everything Else Second.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   JOURNALOS — DESIGN TOKENS
   Concept: a physical, ink-and-paper personal ledger, quietly
   modernized with an iOS-style glass shell: floating frosted
   panels over soft color blobs, pill buttons, spring transitions.
   ============================================================ */
:root{
  --paper:      #F6F1E6;
  --paper-dim:  #ECE4D2;
  --paper-card: #FFFDF8;
  --ink:        #23291F;
  --ink-soft:   #5B5A4E;
  --ink-faint:  #8C8B7C;
  --rule:       #DDD4BC;
  --accent:     #B4722C;
  --accent-soft:#E4C79B;
  --sage:       #5E7A5E;
  --sage-soft:  #DCE6D9;
  --rust:       #A6503B;
  --rust-soft:  #EAD3CB;
  --sky:        #4E6E85;
  --sky-soft:   #D9E3E9;

  --font-serif: 'Fraunces', Georgia, serif;
  --font-sans:  'Inter', -apple-system, sans-serif;

  --radius:     16px;
  --radius-lg:  22px;
  --radius-sm:  11px;
  --shadow:     0 1px 2px rgba(35,41,31,0.05), 0 10px 30px -14px rgba(35,41,31,0.18);
  --shadow-float: 0 14px 38px -12px rgba(35,41,31,.28), 0 2px 10px -3px rgba(35,41,31,.14);
  --ease:       cubic-bezier(.22,.91,.32,1.04);

  /* Glass surfaces — frosted panels that sit above the soft blobs
     painted on <body>, giving the iOS "material" look. */
  --glass-bg:        rgba(255,253,248,0.58);
  --glass-bg-strong: rgba(255,253,248,0.78);
  --glass-border:    rgba(255,255,255,0.6);
  --glass-blur:      22px;
}
:root[data-theme="dark"]{
  --paper:      #1B1B17;
  --paper-dim:  #232320;
  --paper-card: #242420;
  --ink:        #EDE8D9;
  --ink-soft:   #B8B3A2;
  --ink-faint:  #7C7A6C;
  --rule:       #38372F;
  --accent:     #D79B54;
  --accent-soft:#4A3A24;
  --sage:       #8FAE8C;
  --sage-soft:  #2C3A2A;
  --rust:       #CE8874;
  --rust-soft:  #3E2A24;
  --sky:        #8FB1C6;
  --sky-soft:   #23343C;
  --shadow:     0 1px 2px rgba(0,0,0,0.3), 0 10px 30px -14px rgba(0,0,0,0.55);
  --shadow-float: 0 16px 40px -12px rgba(0,0,0,.65), 0 2px 10px -3px rgba(0,0,0,.45);
  --glass-bg:        rgba(33,33,29,0.55);
  --glass-bg-strong: rgba(33,33,29,0.74);
  --glass-border:    rgba(255,255,255,0.09);
}
*{box-sizing:border-box;}
html{-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased;transition:background .2s,color .2s;
  min-height:100vh;position:relative;overflow-x:hidden;}
/* Soft, fixed color blobs behind everything — this is what the frosted
   glass panels blur, the same way iOS wallpapers show through Control Center. */
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(620px 520px at 6% -8%,  var(--accent-soft) 0%, transparent 62%),
    radial-gradient(520px 480px at 104% 8%, var(--sky-soft) 0%, transparent 60%),
    radial-gradient(580px 520px at 12% 106%, var(--sage-soft) 0%, transparent 62%),
    radial-gradient(460px 420px at 96% 100%, var(--rust-soft) 0%, transparent 58%);
  opacity:.6;filter:blur(6px);transition:opacity .3s;
}
:root[data-theme="dark"] body::before{ opacity:.32; }
h1,h2,h3,.serif{font-family:var(--font-serif);font-weight:500;letter-spacing:-0.01em;}
button{font-family:var(--font-sans);cursor:pointer;}
input,textarea,select{font-family:var(--font-sans);}
::selection{background:var(--accent-soft);}

/* ---------- App shell ----------
   Desktop / laptop: the left nav is a persistent icon "dock" with NO
   background of its own — circular icon buttons float directly over the
   page, exactly like a collapsed macOS/iOS control surface. Tapping the
   dock's own toggle expands it: it gains a light frosted-glass panel and
   the icons grow text labels, then collapsing removes the panel again.
   Mobile: the dock becomes an off-canvas drawer opened from the topbar
   hamburger, and the bottom tab bar carries primary navigation. */
:root{ --dock-collapsed:64px; --dock-expanded:224px; }
#app{display:none;min-height:100vh;}
#app.shown{display:block;}

.sidebar{position:fixed;left:12px;top:76px;bottom:88px;z-index:60;
  width:var(--dock-collapsed);display:flex;flex-direction:column;gap:6px;
  padding:10px 8px;border-radius:26px;background:transparent;
  border:1px solid transparent;box-shadow:none;overflow-y:auto;overflow-x:hidden;
  scrollbar-width:none;
  transition:width .32s var(--ease),background .32s var(--ease),
    border-color .32s var(--ease),box-shadow .32s var(--ease),padding .32s var(--ease);}
.sidebar::-webkit-scrollbar{display:none;}
.sidebar.expanded{width:var(--dock-expanded);padding:14px 12px;
  background:var(--glass-bg-strong);backdrop-filter:blur(var(--glass-blur)) saturate(1.5);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.5);
  border-color:var(--glass-border);box-shadow:var(--shadow-float);}

.dock-toggle{flex:none;width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.14);
  color:var(--ink-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;
  transition:background .15s,transform .15s var(--ease),margin .32s var(--ease);}
:root[data-theme="dark"] .dock-toggle{background:rgba(255,255,255,.05);}
.sidebar.expanded .dock-toggle{margin:0 0 6px auto;}
.dock-toggle:hover{background:rgba(255,255,255,.28);color:var(--ink);}
:root[data-theme="dark"] .dock-toggle:hover{background:rgba(255,255,255,.1);}
.dock-toggle:active{transform:scale(.88);}
.dock-toggle svg{width:15px;height:15px;transition:transform .32s var(--ease);}
.sidebar.expanded .dock-toggle svg{transform:rotate(180deg);}

.brand{display:flex;align-items:baseline;gap:6px;padding:6px 10px 20px;}
.brand .mark{font-family:var(--font-serif);font-size:22px;font-style:italic;color:var(--accent);}
.brand .word{font-family:var(--font-serif);font-size:19px;}

.nav-item{display:flex;align-items:center;gap:10px;padding:0;height:44px;width:44px;flex:none;
  border-radius:22px;color:var(--ink-soft);text-decoration:none;font-size:14px;font-weight:500;
  border:none;background:none;text-align:left;justify-content:center;position:relative;
  transition:background .15s,color .15s,transform .15s var(--ease),width .32s var(--ease),
    justify-content .32s var(--ease),padding .32s var(--ease);}
.sidebar.expanded .nav-item{width:100%;justify-content:flex-start;padding:0 8px;}
.nav-item .ic{flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;background:rgba(255,255,255,.16);transition:background .15s,box-shadow .15s;}
:root[data-theme="dark"] .nav-item .ic{background:rgba(255,255,255,.06);}
.nav-item svg{width:17px;height:17px;flex:none;opacity:.85;}
.nav-item .lbl{white-space:nowrap;overflow:hidden;opacity:0;max-width:0;
  transition:opacity .2s,max-width .32s var(--ease);}
.sidebar.expanded .nav-item .lbl{opacity:1;max-width:140px;margin-left:2px;}
.nav-item:hover .ic{background:rgba(255,255,255,.32);}
:root[data-theme="dark"] .nav-item:hover .ic{background:rgba(255,255,255,.11);}
.nav-item:active{transform:scale(.94);}
.nav-item.active{color:var(--ink);font-weight:600;}
.nav-item.active .ic{background:var(--accent);color:#fff;box-shadow:0 4px 12px -3px rgba(180,114,44,.55);}
:root[data-theme="dark"] .nav-item.active .ic{color:#1B1B17;}

/* Tooltip label shown on hover while the dock is collapsed (icon-only).
   position:fixed + JS-computed coordinates (see initSidebarTooltips) so the
   label escapes the sidebar's own overflow/scroll box and always renders on
   top of every other floating chip — a soft glassy chip, matching the rest
   of the dock's frosted-glass language. */
.nav-item .tip{position:fixed;top:0;left:0;transform:translateY(-50%) translateX(-4px);
  background:var(--glass-bg-strong);color:var(--ink);font-size:12px;font-weight:600;padding:7px 13px;
  border-radius:10px;white-space:nowrap;opacity:0;pointer-events:none;
  border:1px solid var(--glass-border);
  backdrop-filter:blur(var(--glass-blur)) saturate(1.6);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.6);
  box-shadow:var(--shadow-float);transition:opacity .15s,transform .15s;z-index:9999;}
.sidebar:not(.expanded):not(.open) .nav-item:hover .tip{opacity:1;transform:translateY(-50%) translateX(0);}
.sidebar.expanded .nav-item .tip,.sidebar.open .nav-item .tip{display:none;}

.nav-sep{height:1px;background:var(--glass-border);margin:10px auto;opacity:.8;width:26px;
  transition:width .32s var(--ease),margin .32s var(--ease);}
.sidebar.expanded .nav-sep{width:100%;margin:10px 4px;}
.nav-label{display:none;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--ink-faint);padding:10px 8px 2px;}
.sidebar.expanded .nav-label{display:block;}

.sidebar-foot{margin-top:auto;padding-top:8px;display:flex;justify-content:center;}
.sidebar.expanded .sidebar-foot{justify-content:flex-start;}
.streak-pill{display:flex;align-items:center;gap:8px;padding:8px;background:rgba(255,255,255,.16);
  border:1px solid var(--glass-border);border-radius:22px;font-size:13px;color:var(--ink-soft);
  width:38px;height:38px;justify-content:center;overflow:hidden;
  transition:width .32s var(--ease),padding .32s var(--ease),border-radius .32s var(--ease);}
:root[data-theme="dark"] .streak-pill{background:rgba(255,255,255,.06);}
.sidebar.expanded .streak-pill{width:100%;justify-content:flex-start;padding:9px 12px;border-radius:14px;}
.streak-pill b{color:var(--accent);font-family:var(--font-serif);font-size:16px;flex:none;}
.streak-pill .stxt{opacity:0;max-width:0;white-space:nowrap;overflow:hidden;
  transition:opacity .2s,max-width .32s var(--ease);}
.sidebar.expanded .streak-pill .stxt{opacity:1;max-width:110px;}

@media (max-width:860px){
  .sidebar{transform:translateX(-130%);top:66px;bottom:66px;left:10px;width:min(78vw,240px);
    padding:14px 12px;transition:transform .32s var(--ease);}
  .sidebar.open{transform:translateX(0);
    background:var(--glass-bg-strong);backdrop-filter:blur(var(--glass-blur)) saturate(1.5);
    -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.5);
    border:1px solid var(--glass-border);box-shadow:var(--shadow-float);}
  .sidebar .nav-item{width:100%;justify-content:flex-start;padding:0 8px;}
  .sidebar .nav-item .lbl{opacity:1;max-width:140px;margin-left:2px;}
  .sidebar .nav-label{display:block;}
  .sidebar .nav-sep{width:100%;margin:10px 4px;}
  .sidebar .streak-pill{width:100%;justify-content:flex-start;padding:9px 12px;border-radius:14px;}
  .sidebar .streak-pill .stxt{opacity:1;max-width:110px;}
  .dock-toggle{display:none;}
}

.main{padding:88px 32px 92px;max-width:960px;width:100%;margin:0 auto;}
.main{margin-left:calc(var(--dock-expanded) + 30px);}
#main.view-anim{animation:viewIn .32s var(--ease);}
@keyframes viewIn{ from{opacity:0;transform:translateY(7px);} to{opacity:1;transform:translateY(0);} }
@media (max-width:860px){ .main{padding:78px 18px 118px;max-width:100%;margin-left:auto!important;} }
@media (max-width:480px){ .main{padding:74px 12px 122px;} }

/* Floating top chrome — every control is its own free-floating glass
   chip; there is no continuous bar/background behind them. */
.topbar{display:flex;align-items:center;justify-content:space-between;position:fixed;top:14px;left:14px;right:14px;
  height:40px;z-index:50;padding:0;pointer-events:none;}
.topbar>*{pointer-events:auto;}
.topbar .brand{display:flex;align-items:baseline;gap:6px;background:var(--glass-bg);
  backdrop-filter:blur(var(--glass-blur)) saturate(1.5);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.5);
  border:1px solid var(--glass-border);border-radius:999px;padding:9px 18px 9px 15px;
  box-shadow:var(--shadow-float);}
.topbar-left{display:flex;align-items:center;gap:8px;}
.topbar-actions{display:flex;align-items:center;gap:8px;}
@media (max-width:600px){ .topbar{left:10px;right:10px;top:10px;height:38px;} }

.chip-btn{background:var(--glass-bg);backdrop-filter:blur(var(--glass-blur)) saturate(1.5);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.5);
  border:1px solid var(--glass-border);color:var(--ink);width:40px;height:40px;
  border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:16px;
  box-shadow:var(--shadow-float);transition:transform .15s var(--ease),background .15s;overflow:hidden;
  flex:none;padding:0;}
.chip-btn:hover{background:var(--glass-bg-strong);}
.chip-btn:active{transform:scale(.88);}
.chip-btn img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.chip-btn.avatar-fallback{background:var(--accent);color:#fff;font-family:var(--font-serif);font-weight:600;}

.hamburger{background:var(--glass-bg);backdrop-filter:blur(var(--glass-blur)) saturate(1.5);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.5);border:1px solid var(--glass-border);
  font-size:16px;color:var(--ink);width:40px;height:40px;border-radius:50%;display:none;flex:none;
  align-items:center;justify-content:center;box-shadow:var(--shadow-float);
  transition:background .15s,transform .15s var(--ease);}
@media (max-width:860px){ .hamburger.mobile-only{display:inline-flex;} }
.hamburger:hover{background:var(--glass-bg-strong);}
.hamburger:active{transform:scale(.9);}
.topbar-fab{background:var(--accent);color:#fff;border:none;width:40px;height:40px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;font-size:18px;flex:none;
  box-shadow:0 4px 14px -3px rgba(180,114,44,.6);transition:transform .15s var(--ease);}
.topbar-fab:active{transform:scale(.86);}
.topbar-fab:hover{filter:brightness(1.07);}

.overlay{display:none;position:fixed;inset:0;background:rgba(20,18,14,.32);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:58;}
.overlay.show{display:block;}

/* ---------- Profile popover (opened from the profile chip) ---------- */
.profile-menu{position:fixed;top:60px;right:14px;width:252px;z-index:80;
  background:var(--glass-bg-strong);backdrop-filter:blur(var(--glass-blur)) saturate(1.5);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.5);border:1px solid var(--glass-border);
  border-radius:18px;box-shadow:var(--shadow-float);padding:8px;
  opacity:0;transform:translateY(-6px) scale(.97);pointer-events:none;
  transition:opacity .18s var(--ease),transform .18s var(--ease);}
.profile-menu.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
@media (max-width:600px){ .profile-menu{top:54px;right:10px;} }
.profile-menu-head{display:flex;align-items:center;gap:10px;padding:8px 8px 12px;}
.pm-avatar{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-weight:600;}
.pm-name{font-size:13.5px;font-weight:600;color:var(--ink);}
.pm-email{font-size:11.5px;color:var(--ink-faint);}
.pm-item{display:flex;align-items:center;gap:8px;width:100%;padding:10px 8px;border:none;background:none;
  text-align:left;border-radius:12px;font-size:13.5px;color:var(--ink-soft);
  transition:background .15s,color .15s;}
.pm-item:hover{background:rgba(255,255,255,.2);color:var(--ink);}
:root[data-theme="dark"] .pm-item:hover{background:rgba(255,255,255,.07);}
.pm-sep{height:1px;background:var(--glass-border);margin:6px 6px;opacity:.8;}

/* ---------- Mobile bottom app-nav ---------- */
.bottom-nav{display:none;}
@media (max-width:860px){
  .bottom-nav{display:flex;align-items:center;justify-content:space-between;position:fixed;left:10px;right:10px;bottom:12px;
    z-index:45;background:var(--glass-bg-strong);backdrop-filter:blur(var(--glass-blur)) saturate(1.5);
    -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.5);
    border:1px solid var(--glass-border);border-radius:28px;
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:var(--shadow-float);}
}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:none;color:var(--ink-faint);font-size:10.5px;padding:6px 2px;border-radius:14px;
  min-width:0;transition:transform .15s var(--ease),color .15s;}
.bn-item svg{width:21px;height:21px;flex:none;}
.bn-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.bn-item.active{color:var(--accent);}
.bn-item:active{transform:scale(.92);}
.bn-fab{flex:none;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;border:none;
  display:flex;align-items:center;justify-content:center;margin:0 2px;margin-top:-22px;
  box-shadow:0 6px 18px -4px rgba(180,114,44,.6);border:3px solid var(--glass-bg-strong);
  transition:transform .15s var(--ease);}
.bn-fab:active{transform:scale(.92);}
.bn-fab svg{width:24px;height:24px;}

/* ---------- Bottom action sheets (mobile quick-add / mood) ---------- */
.sheet-backdrop{position:fixed;inset:0;background:rgba(20,18,12,.4);backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);display:none;align-items:flex-end;
  justify-content:center;z-index:75;}
.sheet-backdrop.show{display:flex;}
.sheet{background:var(--glass-bg-strong);backdrop-filter:blur(var(--glass-blur)) saturate(1.4);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.4);
  border:1px solid var(--glass-border);width:100%;max-width:480px;border-radius:26px 26px 0 0;
  padding:8px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow-float);
  max-height:80vh;overflow-y:auto;animation:sheetUp .28s var(--ease);}
@keyframes sheetUp{ from{transform:translateY(24px);opacity:.5;} to{transform:translateY(0);opacity:1;} }
.sheet-handle{width:36px;height:4px;background:var(--rule);border-radius:99px;margin:6px auto 14px;}
.sheet-title{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint);
  margin:0 0 10px;padding:0 6px;}
.sheet-action{display:flex;align-items:center;gap:14px;width:100%;padding:13px 6px;border:none;background:none;
  text-align:left;border-radius:var(--radius-sm);transition:background .15s,transform .15s var(--ease);}
.sheet-action:hover{background:rgba(255,255,255,.2);}
:root[data-theme="dark"] .sheet-action:hover{background:rgba(255,255,255,.06);}
.sheet-action:active{transform:scale(.98);}
.sheet-icon{font-size:21px;flex:none;width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius-sm);}
.sheet-action b{display:block;font-size:14px;color:var(--ink);}
.sheet-sub{font-size:12px;color:var(--ink-faint);margin-top:1px;}
.quick-mood-grid{display:flex;flex-wrap:wrap;gap:8px;padding:2px 6px 14px;}

.page-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;
  margin-bottom:22px;}
.page-head h1{font-size:27px;margin:0;}
.page-head .sub{color:var(--ink-faint);font-size:13.5px;margin-top:2px;}
.date-tag{color:var(--ink-faint);font-size:13px;}

/* ---------- Cards / generic ---------- */
.card{background:var(--paper-card);border:1px solid var(--rule);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);}
.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:1.3fr 1fr;}
@media (max-width:760px){ .grid-2{grid-template-columns:1fr;} }
.grid-3{grid-template-columns:repeat(3,1fr);}
@media (max-width:760px){ .grid-3{grid-template-columns:1fr 1fr;} }
.section-title{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint);
  margin:0 0 12px;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:8px;border:1px solid var(--rule);
  background:var(--paper-card);color:var(--ink);font-size:13.5px;font-weight:500;}
.btn:hover{border-color:var(--ink-faint);}
.btn-primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
:root[data-theme="dark"] .btn-primary{background:var(--accent);color:#1B1B17;border-color:var(--accent);}
.btn-primary:hover{opacity:.9;}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-ghost{background:none;border-color:transparent;color:var(--ink-soft);}
.btn-ghost:hover{background:var(--paper-dim);}
.btn-sm{padding:6px 11px;font-size:12.5px;}
.btn-danger{color:var(--rust);}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;
  background:var(--paper-dim);color:var(--ink-soft);border:1px solid var(--rule);}
.tag{display:inline-flex;padding:3px 9px;border-radius:99px;font-size:11.5px;background:var(--sky-soft);
  color:var(--sky);}
.empty{color:var(--ink-faint);font-size:13.5px;padding:20px 4px;text-align:center;}

/* ---------- Mood chip ---------- */
.mood-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:12.5px;font-weight:500;}
.mood-happy{background:#F3E3B8;color:#7A5B12;}
.mood-calm{background:var(--sage-soft);color:var(--sage);}
.mood-sad{background:var(--sky-soft);color:var(--sky);}
.mood-stressed{background:var(--rust-soft);color:var(--rust);}
.mood-angry{background:#E9C6C6;color:#93342A;}
.mood-neutral{background:var(--paper-dim);color:var(--ink-soft);}

/* ---------- Auth screen ---------- */
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.auth-box{width:100%;max-width:380px;text-align:center;}
.auth-box .mark{font-family:var(--font-serif);font-style:italic;color:var(--accent);font-size:34px;}
.auth-box h1{margin:2px 0 6px;font-size:26px;}
.auth-box p.tag{display:block;color:var(--ink-faint);font-size:13.5px;margin-bottom:26px;}
.field{margin-bottom:12px;text-align:left;}
.field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;border-radius:8px;
  border:1px solid var(--rule);background:var(--paper-card);color:var(--ink);font-size:14px;}
.field textarea{resize:vertical;font-family:var(--font-serif);font-size:16px;line-height:1.6;}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--accent-soft);
  border-color:var(--accent);}
.auth-switch{margin-top:16px;font-size:13px;color:var(--ink-faint);}
.auth-switch button{background:none;border:none;color:var(--accent);font-weight:600;font-size:13px;padding:0;}

/* ---------- Dashboard ---------- */
.today-hero{background:linear-gradient(155deg,var(--paper-card),var(--paper-dim));border:1px solid var(--rule);
  border-radius:var(--radius);padding:26px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.today-hero .eyebrow{color:var(--ink-faint);font-size:13px;}
.today-hero h2{font-size:24px;margin:4px 0 14px;}
.today-hero .preview{color:var(--ink-soft);font-size:14.5px;line-height:1.6;max-width:60ch;}
.hero-actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;}
.stat{display:flex;flex-direction:column;gap:2px;}
.stat b{font-family:var(--font-serif);font-size:26px;}
.stat span{font-size:12px;color:var(--ink-faint);}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px;}
@media (max-width:760px){ .quick-grid{grid-template-columns:repeat(2,1fr);} }
.quick-btn{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;
  border-radius:9px;border:1px solid var(--rule);background:var(--paper-card);text-align:left;}
.quick-btn:hover{border-color:var(--accent);}
.quick-btn svg{width:18px;height:18px;color:var(--accent);}
.quick-btn span{font-size:13px;font-weight:500;}

/* Module 04: Dashboard's Daily Overview chips + clickable Recent Activity rows */
.overview-row{display:flex;flex-wrap:wrap;gap:10px;}
.overview-chip{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;
  background:var(--paper-dim);border:1px solid var(--rule);font-size:12.5px;color:var(--ink-soft);}
.overview-chip b{color:var(--ink);font-family:var(--font-serif);font-size:14px;font-weight:600;}
.dash-activity-row{padding:8px 0;border-bottom:1px solid var(--rule);font-size:13.5px;cursor:pointer;
  border-radius:6px;transition:background .12s;}
.dash-activity-row:hover{background:var(--paper-dim);}
.dash-activity-row:last-child{border-bottom:none;}

/* ---------- Journal list / timeline ---------- */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.filter-row select,.filter-row input[type=text],.filter-row input[type=date]{padding:7px 10px;border-radius:7px;border:1px solid var(--rule);
  background:var(--paper-card);color:var(--ink);font-size:13px;}
.entry-row{display:flex;gap:14px;padding:14px 4px;border-bottom:1px solid var(--rule);align-items:flex-start;
  cursor:pointer;}
.entry-row:hover{background:var(--paper-dim);border-radius:8px;}
.entry-date{width:70px;flex:none;text-align:center;padding-top:2px;}
.entry-date .d{font-family:var(--font-serif);font-size:20px;line-height:1;}
.entry-date .m{font-size:10.5px;text-transform:uppercase;color:var(--ink-faint);letter-spacing:.05em;}
.entry-body{flex:1;min-width:0;}
.entry-body h3{margin:0 0 4px;font-size:15.5px;}
.entry-body p{margin:0 0 8px;color:var(--ink-soft);font-size:13.5px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.entry-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.entry-star{color:var(--accent);font-size:15px;}
.intensity-tag{font-size:11px;color:var(--ink-faint);}

/* ---------- Module 07: Insights / Analytics ---------- */
.period-tabs{display:flex;gap:6px;flex-wrap:wrap;}
.period-tabs .btn{padding:7px 13px;}
.ins-section{margin-top:22px;}
.ins-section:first-child{margin-top:0;}
.ins-section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.ins-section-head h2{font-size:16.5px;margin:0;font-family:var(--font-serif);}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media (max-width:760px){ .stat-grid{grid-template-columns:1fr 1fr;} }
.stat-card{background:var(--paper-card);border:1px solid var(--rule);border-radius:var(--radius-sm);padding:14px 16px;}
.stat-card b{display:block;font-family:var(--font-serif);font-size:22px;line-height:1.15;}
.stat-card span{font-size:11.5px;color:var(--ink-faint);}
.bar-row{margin-bottom:10px;}
.bar-row:last-child{margin-bottom:0;}
.bar-row .bar-label{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;}
.bar-row .bar-label .n{color:var(--ink-faint);}
.bar-track{height:7px;background:var(--paper-dim);border-radius:99px;overflow:hidden;}
.bar-fill{height:100%;background:var(--accent);border-radius:99px;}
.mini-chart{display:flex;align-items:flex-end;gap:3px;height:90px;padding-top:6px;}
.mini-chart .col{flex:1;min-width:2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.mini-chart .col .b{width:100%;border-radius:3px 3px 0 0;background:var(--accent-soft);min-height:2px;}
.mini-chart .col .b.hi{background:var(--accent);}
.mini-chart-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-faint);margin-top:4px;}
.trend-badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;display:inline-flex;align-items:center;gap:3px;}
.trend-up{background:var(--sage-soft);color:var(--sage);}
.trend-down{background:var(--rust-soft);color:var(--rust);}
.trend-flat{background:var(--paper-dim);color:var(--ink-faint);}
.compare-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13px;}
.compare-row:last-child{border-bottom:none;}
.compare-row .lbl{color:var(--ink-soft);}
.compare-row .vals{display:flex;align-items:center;gap:8px;}
.compare-row .vals .now{font-weight:600;font-family:var(--font-serif);font-size:14.5px;}
.compare-row .vals .prev{color:var(--ink-faint);font-size:12px;}
.life-mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media (max-width:760px){ .life-mini-grid{grid-template-columns:1fr 1fr;} }
.life-mini{text-align:center;padding:12px 8px;border-radius:9px;background:var(--paper-dim);}
.life-mini b{display:block;font-family:var(--font-serif);font-size:20px;}
.life-mini span{font-size:11px;color:var(--ink-faint);}
.ai-status-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.ai-status-badge{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--paper-dim);color:var(--ink-faint);}
.ai-status-badge.ready{background:var(--sage-soft);color:var(--sage);}
.ai-status-badge.failed{background:var(--rust-soft);color:var(--rust);}
.ai-status-badge.generating{background:var(--sky-soft);color:var(--sky);}
.ai-reflect h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin:14px 0 6px;}
.ai-reflect h4:first-child{margin-top:0;}
.ai-reflect p{font-size:13.5px;color:var(--ink-soft);line-height:1.65;margin:0 0 4px;white-space:pre-wrap;}
.pattern-card{border:1px solid var(--rule);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;}
.pattern-card:last-child{margin-bottom:0;}
.pattern-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:5px;}
.pattern-head h4{margin:0;font-size:14px;}
.conf-badge{font-size:10.5px;padding:2px 8px;border-radius:99px;flex:none;white-space:nowrap;font-weight:600;}
.conf-high{background:var(--sage-soft);color:var(--sage);}
.conf-medium{background:var(--accent-soft);color:var(--accent);}
.conf-low{background:var(--paper-dim);color:var(--ink-faint);}
.pattern-sources{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;}
.month-nav .lbl{font-family:var(--font-serif);font-size:17px;}

/* ---------- Calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-dow{text-align:center;font-size:11px;color:var(--ink-faint);padding-bottom:4px;text-transform:uppercase;}
.cal-cell{aspect-ratio:1;border-radius:8px;border:1px solid var(--rule);background:var(--paper-card);
  padding:6px;display:flex;flex-direction:column;justify-content:space-between;font-size:12px;position:relative;}
.cal-cell.empty{border:none;background:none;}
.cal-cell.has-entry{cursor:pointer;}
.cal-cell.has-entry:hover{border-color:var(--accent);}
.cal-cell.today{box-shadow:inset 0 0 0 2px var(--accent);}
.cal-cell.has-archived{border-style:dashed;}
.cal-dot{width:7px;height:7px;border-radius:99px;align-self:flex-end;flex:none;}
.cal-dot-row{display:flex;gap:3px;align-self:flex-end;align-items:center;}
.cal-dot-mini{width:6px;height:6px;border-radius:99px;flex:none;}
.cal-more{font-size:8.5px;color:var(--ink-faint);margin-left:1px;}
.cal-pin{position:absolute;top:4px;left:5px;font-size:9px;line-height:1;}
.cal-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:12px;
  border-top:1px solid var(--rule);font-size:11.5px;color:var(--ink-faint);}
.cal-legend span.dot{width:8px;height:8px;border-radius:99px;display:inline-block;margin-right:4px;}
.cal-legend .item{display:inline-flex;align-items:center;}

/* ---------- Editor ---------- */
.editor-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.title-input{font-family:var(--font-serif);font-size:24px;border:none;background:none;color:var(--ink);
  width:100%;padding:2px 0;}
.title-input:focus{outline:none;}
.title-input::placeholder{color:var(--ink-faint);}
.content-input{width:100%;min-height:340px;border:none;background:none;color:var(--ink);
  font-family:var(--font-serif);font-size:17px;line-height:1.75;resize:vertical;padding:6px 0;}
.content-input:focus{outline:none;}
.content-input::placeholder{color:var(--ink-faint);font-style:italic;}
.mood-picker{display:flex;gap:8px;flex-wrap:wrap;}
.mood-opt{padding:6px 13px;border-radius:99px;border:1px solid var(--rule);background:var(--paper-card);
  font-size:13px;color:var(--ink-soft);}
.mood-opt.selected{border-color:var(--accent);color:var(--ink);font-weight:600;background:var(--accent-soft);}
.intensity-row{margin-top:12px;}
.intensity-row input[type=range]{width:100%;accent-color:var(--accent);height:4px;display:block;}
.tag-input-wrap{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1px solid var(--rule);border-radius:8px;
  background:var(--paper-card);}
.tag-input-wrap input{border:none;background:none;flex:1;min-width:90px;font-size:13px;color:var(--ink);}
.tag-chip{display:inline-flex;align-items:center;gap:5px;background:var(--sky-soft);color:var(--sky);
  padding:3px 8px;border-radius:99px;font-size:12px;}
.tag-chip button{background:none;border:none;color:var(--sky);font-size:13px;line-height:1;padding:0;}
.toggle-row{display:flex;gap:16px;margin-top:14px;flex-wrap:wrap;}
.toggle{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft);}
.editor-footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;
  padding-top:16px;border-top:1px solid var(--rule);flex-wrap:wrap;gap:10px;}
.word-count{font-size:12.5px;color:var(--ink-faint);}

.ai-box{border:1px dashed var(--rule);border-radius:9px;padding:14px 16px;margin-top:18px;background:var(--paper-dim);}
.ai-box .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.ai-box .head span{font-size:12.5px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
.ai-box p{margin:0;font-size:13.5px;color:var(--ink-soft);line-height:1.6;}
.ai-note{font-size:11.5px;color:var(--ink-faint);margin-top:8px;}

/* ---------- Search ---------- */
.search-hero input{width:100%;padding:14px 16px;font-size:16px;border-radius:10px;border:1px solid var(--rule);
  background:var(--paper-card);color:var(--ink);}
.search-hero input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
.search-empty{text-align:center;padding:60px 20px;color:var(--ink-faint);}
.search-empty .mark{font-size:32px;color:var(--accent-soft);}

/* ---------- Settings ---------- */
.settings-group{margin-bottom:26px;}
.settings-group h3{font-size:15px;margin-bottom:10px;}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;
  border-bottom:1px solid var(--rule);gap:16px;}
.settings-row:last-child{border-bottom:none;}
.settings-row .label{font-size:13.5px;}
.settings-row .desc{font-size:12px;color:var(--ink-faint);margin-top:2px;}
.switch{position:relative;width:38px;height:22px;flex:none;}
.switch input{opacity:0;width:0;height:0;}
.switch .track{position:absolute;inset:0;background:var(--rule);border-radius:99px;transition:.2s;}
.switch .track:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;
  border-radius:50%;transition:.2s;}
.switch input:checked + .track{background:var(--accent);}
.switch input:checked + .track:before{transform:translateX(16px);}
.hook-box{background:var(--paper-dim);border:1px dashed var(--rule);border-radius:8px;padding:12px 14px;
  font-size:12.5px;color:var(--ink-soft);line-height:1.6;}
.hook-box code{background:var(--paper-card);padding:1px 5px;border-radius:4px;font-size:11.5px;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);
  color:var(--paper);padding:11px 20px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;
  transition:.25s;z-index:100;max-width:calc(100% - 32px);text-align:center;}
@media (max-width:860px){ .toast{bottom:calc(78px + env(safe-area-inset-bottom));} }
:root[data-theme="dark"] .toast{background:var(--accent);color:#1B1B17;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.modal-backdrop{position:fixed;inset:0;background:rgba(20,18,12,.45);display:none;align-items:center;
  justify-content:center;z-index:60;padding:20px;}
.modal-backdrop.show{display:flex;}
.modal{background:var(--paper-card);border-radius:12px;padding:22px;max-width:380px;width:100%;
  box-shadow:var(--shadow);}
.modal h3{margin:0 0 8px;font-size:17px;}
.modal p{font-size:13.5px;color:var(--ink-soft);line-height:1.6;margin:0 0 18px;}
.modal .row{display:flex;gap:10px;justify-content:flex-end;}

.scroll-x{overflow-x:auto;}

/* ---------- Module 02: Draft banner + status ---------- */
.draft-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:var(--sky-soft);border:1px dashed var(--sky);border-radius:9px;padding:12px 14px;margin-bottom:16px;}
.draft-banner span{font-size:13px;color:var(--ink);}
.draft-banner .row{display:flex;gap:8px;flex-wrap:wrap;}
.draft-status{font-size:12px;color:var(--ink-faint);}
.draft-status.saving{color:var(--accent);}

/* ---------- Module 02: Lightweight formatting toolbar ---------- */
.fmt-toolbar{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding-bottom:8px;
  border-bottom:1px solid var(--rule);margin-bottom:4px;}
.fmt-btn{min-width:30px;height:30px;padding:0 8px;border-radius:7px;border:1px solid var(--rule);
  background:var(--paper-card);color:var(--ink-soft);font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;}
.fmt-btn:hover{border-color:var(--accent);color:var(--ink);}

/* ---------- Write mode: fixed floating editor toolbar ---------- */
/* Holds every editing / customization control — incl. Save — so it stays
   reachable no matter how far the user has scrolled into a long entry.
   Hides while scrolling down, reappears on scroll-up (like a browser address bar).
   Sits BELOW the floating topbar (profile/settings/theme chips), with a
   visible gap, as its own soft glass pill — matching the topbar/sidebar's
   frosted-glass language instead of a flat edge-to-edge bar that collided
   with the topbar's own fixed controls. */
.write-fixed-bar{position:fixed;top:68px;left:calc(var(--dock-expanded) + 30px);right:14px;z-index:38;
  background:var(--glass-bg-strong);backdrop-filter:blur(var(--glass-blur)) saturate(1.5);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.5);
  border:1px solid var(--glass-border);border-radius:20px;box-shadow:var(--shadow-float);
  padding:9px 18px;display:none;align-items:center;gap:8px;
  overflow-x:auto;white-space:nowrap;-ms-overflow-style:none;scrollbar-width:none;
  transform:translateY(-130%);transition:transform .22s ease;}
.write-fixed-bar::-webkit-scrollbar{display:none;}
.write-fixed-bar.active{display:flex;}
.write-fixed-bar.show{transform:translateY(0);}
.write-fixed-bar .wfb-group{display:flex;align-items:center;gap:6px;flex:none;}
.write-fixed-bar .btn,.write-fixed-bar .fmt-btn{flex:none;}
.write-fixed-bar .wfb-sep{width:1px;height:22px;background:var(--glass-border);flex:none;}
.write-fixed-bar .wfb-spacer{flex:1 0 auto;min-width:16px;}
.write-fixed-bar input[type="date"]{border:1px solid var(--glass-border);background:var(--paper-card);
  color:var(--ink);border-radius:8px;padding:6px 10px;font-size:12.5px;flex:none;}
.write-fixed-bar .word-count,.write-fixed-bar .draft-status{flex:none;}
body.write-mode .main{padding-top:148px;}
@media (max-width:860px){
  .write-fixed-bar{left:10px;right:10px;top:56px;border-radius:16px;padding:8px 14px;}
  body.write-mode .main{padding-top:136px;}
}
.content-preview{min-height:340px;padding:6px 0;font-family:var(--font-serif);font-size:17px;line-height:1.75;color:var(--ink);}
.content-preview .empty{text-align:left;}

/* ---------- Module 02: Archive ---------- */
.archived-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;
  background:var(--rust-soft);color:var(--rust);}

/* ---------- Module 02: sticky auto-hide editor toolbar ---------- */
.write-toolbar-fixed{position:sticky;top:0;z-index:25;background:var(--paper);
  border-bottom:1px solid var(--rule);padding:10px 6px 8px;margin:0 0 18px;border-radius:0 0 10px 10px;
  display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 14px -8px rgba(35,41,31,.15);
  transform:translateY(0);transition:transform .25s ease;}
.write-toolbar-fixed.wt-hidden{transform:translateY(-115%);}
@media (max-width:860px){ .write-toolbar-fixed{ top:52px; } }
.wt-row{display:flex;align-items:center;gap:8px;}
.wt-scroll{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:2px 0;}
.wt-scroll::-webkit-scrollbar{display:none;}
.wt-scroll>*{flex:none;}
.wt-pin{display:flex;align-items:center;gap:8px;flex:none;}

/* ---------- App-feel micro interactions ---------- */
.btn{transition:transform .15s var(--ease),border-color .15s,background .15s,box-shadow .15s,opacity .15s;}
.btn:active{transform:scale(.96);}
.card{transition:box-shadow .2s,transform .2s var(--ease);}

<script>
/* ================================================================
   JOURNALOS — APP LOGIC
   MVP scope (Master Plan §41): Auth, Journal, Mood, Timeline,
   Calendar, Basic Search, AI Daily/Weekly Summary (stubbed),
   Dashboard, Settings.

   DATA LAYER
   ----------------------------------------------------------------
   Data now lives in Firebase:
     users/{uid}                 -> profile + settings (map field)
     users/{uid}/entries/{id}    -> one journal entry per doc
   Real-time listeners (onSnapshot) keep state.entries / state.settings
   in sync across tabs/devices automatically.

   AI LAYER
   ----------------------------------------------------------------
   `generateDailySummary()` calls the Gemini API (generateContent)
   using the API key saved in Settings, for the Write page's daily
   preview. `extractInformation()` stays a fast local keyword
   heuristic (no API call) since it runs on every dashboard render.
   `localWeeklySummary()`/`generateWeeklySummary()` are kept as
   general-purpose helpers but are no longer wired into the UI —
   Module 07's Insights → AI Insights tab replaced the old single
   weekly-summary card with cached weekly/monthly/yearly reflections
   (see PERIOD ANALYSIS CACHE below runLifeExtraction/Module 06).
   ================================================================ */

const THEME_CACHE_KEY = 'journalos_theme_cache'; // local-only, avoids a flash of wrong theme before Firebase responds
const DEFAULT_SETTINGS = {theme:'light', apiKey:'', dailyReminder:true, weeklySummary:true, aiExtraction:true,
  // Module 04: which Dashboard sections the user wants to see, synced through
  // the same Firestore user-settings doc as every other preference (not
  // localStorage-only) so it follows the user across devices.
  dashboardSections: {todayJournal:true, mood:true, dailyOverview:true, aiSummary:true, streakStats:true, quickActions:true, recentActivity:true}};
// Tolerant of settings docs saved before a given section existed — missing
// keys default to visible rather than disappearing.
function dashSectionOn(key){
  const sections = (state.settings && state.settings.dashboardSections) || {};
  return sections[key] !== false;
}

function userDocRef(){ return db.collection('users').doc(state.user.uid); }
function entriesColRef(){ return userDocRef().collection('entries'); }

// Module 06: Life Organization collections — users/{uid}/{achievements,plans,...}.
// "moments" is the Firestore collection name for the Important Moments library.
const LIFE_COLLECTIONS = ['achievements','plans','quotes','ideas','lessons','challenges','moments','events','people','places'];
function lifeColRef(name){ return userDocRef().collection(name); }

let unsubEntries = null, unsubUserDoc = null, unsubLife = {};

function attachLifeListeners(){
  detachLifeListeners();
  LIFE_COLLECTIONS.forEach(name=>{
    unsubLife[name] = lifeColRef(name).onSnapshot(snap=>{
      state.life[name] = snap.docs.map(d=>({id:d.id, ...d.data()}));
      if(state.view==='life' || state.view==='dashboard') render();
    }, err=>console.error(name+' listener error', err));
  });
}
function detachLifeListeners(){
  Object.values(unsubLife).forEach(u=>{ if(u) u(); });
  unsubLife = {};
}

function attachEntriesListener(){
  if(unsubEntries) unsubEntries();
  unsubEntries = entriesColRef().orderBy('date','desc').onSnapshot(snap=>{
    // Normalize older docs that predate moodIntensity / archived so the rest
    // of the app (mood slider, filters, calendar dots) can rely on both
    // fields always being present and correctly typed.
    state.entries = snap.docs.map(d=>{
      const data = d.data();
      return {
        id: d.id, ...data,
        moodIntensity: (typeof data.moodIntensity === 'number' && data.moodIntensity>=1 && data.moodIntensity<=10) ? data.moodIntensity : 5,
        archived: !!data.archived
      };
    });
    if(['dashboard','timeline','calendar','search','insights','archive'].includes(state.view)) render();
    else updateStreak();
  }, err=>{ console.error('entries listener error', err); toast('এন্ট্রি লোড করতে সমস্যা হয়েছে।'); });
}

function attachUserDocListener(){
  if(unsubUserDoc) unsubUserDoc();
  unsubUserDoc = userDocRef().onSnapshot(snap=>{
    const data = snap.exists ? (snap.data().settings || {}) : {};
    state.settings = {...DEFAULT_SETTINGS, ...data};
    document.documentElement.setAttribute('data-theme', state.settings.theme);
    localStorage.setItem(THEME_CACHE_KEY, state.settings.theme);
    syncThemeChipIcon();
    if(state.view==='settings') render();
  }, err=>{ console.error('user doc listener error', err); });
}

async function saveUserSettings(s){
  try{
    await userDocRef().set({settings:s}, {merge:true});
    toast('সেটিংস সংরক্ষিত হয়েছে।');
  }catch(err){
    console.error(err);
    toast('সংরক্ষণ ব্যর্থ হয়েছে: ' + err.message);
  }
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso, opts){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-US', opts || {month:'short', day:'numeric', year:'numeric'});
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

const MOODS = [
  {id:'happy', label:'Happy', emoji:'🙂', cls:'mood-happy'},
  {id:'calm', label:'Calm', emoji:'😌', cls:'mood-calm'},
  {id:'sad', label:'Sad', emoji:'😔', cls:'mood-sad'},
  {id:'stressed', label:'Stressed', emoji:'😣', cls:'mood-stressed'},
  {id:'angry', label:'Angry', emoji:'😠', cls:'mood-angry'},
  {id:'neutral', label:'Neutral', emoji:'😐', cls:'mood-neutral'}
];
function moodInfo(id){ return MOODS.find(m=>m.id===id) || MOODS[5]; }
// Reuses the exact hues already used for each mood's chip text color, so the
// Calendar's mood dots stay visually consistent with the rest of the app
// instead of inventing a second color language.
function moodDotColor(id){
  switch(id){
    case 'happy': return '#8A6A1E';
    case 'calm': return 'var(--sage)';
    case 'sad': return 'var(--sky)';
    case 'stressed': return 'var(--rust)';
    case 'angry': return '#93342A';
    default: return 'var(--ink-faint)';
  }
}

/* ---------------- AI LAYER (Gemini API) ---------------- */
async function callGemini(prompt){
  const apiKey = state.settings && state.settings.apiKey;
  if(!apiKey) return null;
  try{
    const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-goog-api-key': apiKey },
      body: JSON.stringify({ contents:[{ parts:[{ text: prompt }] }] })
    });
    if(!res.ok){
      const errBody = await res.text().catch(()=> '');
      throw new Error(`Gemini ${res.status}: ${errBody.slice(0,180)}`);
    }
    const data = await res.json();
    return (data.candidates && data.candidates[0] && data.candidates[0].content &&
      data.candidates[0].content.parts && data.candidates[0].content.parts[0] &&
      data.candidates[0].content.parts[0].text || '').trim() || null;
  }catch(err){
    console.error('Gemini call failed', err);
    return null;
  }
}
function localDailySummary(entry){
  if(!entry || !entry.content || entry.content.trim().length < 12){
    return "যথেষ্ট লেখা হলে এখানে একটা সংক্ষিপ্ত AI সারাংশ দেখানো হবে।";
  }
  const words = entry.content.trim().split(/\s+/);
  const firstLine = entry.content.trim().split(/[.।\n]/)[0];
  const mood = moodInfo(entry.mood).label;
  return `${firstLine.slice(0,140)}${firstLine.length>140?'…':''} — overall mood: ${mood}, ~${words.length} words written.`;
}
function localWeeklySummary(entries){
  if(!entries.length) return "এই সপ্তাহে এখনো কোনো এন্ট্রি লেখা হয়নি।";
  const moodCount = {};
  entries.forEach(e=>{ moodCount[e.mood] = (moodCount[e.mood]||0)+1; });
  const topMood = Object.entries(moodCount).sort((a,b)=>b[1]-a[1])[0];
  return `${entries.length}টি এন্ট্রি লেখা হয়েছে এই সপ্তাহে। সবচেয়ে বেশি দেখা যাওয়া mood: ${moodInfo(topMood[0]).label}।`;
}
async function generateDailySummary(entry){
  const local = localDailySummary(entry);
  if(!entry || !entry.content || entry.content.trim().length < 12) return local;
  const prompt = `তুমি একজন সহানুভূতিশীল journaling সহকারী। নিচের ডায়েরি এন্ট্রিটি বাংলা বা ইংরেজি, যেভাবেই লেখা হোক, ২-৩ বাক্যে একটা উষ্ণ, ব্যক্তিগত সারাংশ লিখে দাও (mood: ${moodInfo(entry.mood).label}):\n\n"""${entry.content}"""`;
  const ai = await callGemini(prompt);

// Naive local "extraction" — looks for simple cue phrases. Replace with a real
// AI extraction call for actual accuracy (Master Plan Module 12).
function extractInformation(text){
  const out = {achievements:[], plans:[], quotes:[]};
  if(!text) return out;
  text.split(/[.।\n]/).forEach(s=>{
    const t = s.trim(); if(!t) return;
    if(/\b(finished|completed|done|শেষ করেছি|সম্পন্ন)\b/i.test(t)) out.achievements.push(t);
    if(/\b(will|plan to|going to|next week|করব|প্ল্যান)\b/i.test(t)) out.plans.push(t);
    if(/["“”]/.test(t)) out.quotes.push(t);
  });
  return out;
}

function parseLifeExtractionJSON(raw){
  if(!raw) return null;
  let t = raw.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  const first = t.indexOf('{'), last = t.lastIndexOf('}');
  if(first===-1 || last===-1) return null;
  t = t.slice(first, last+1);
  try{
    const obj = JSON.parse(t);
    const arr = k=>Array.isArray(obj[k]) ? obj[k] : [];
    return {
      achievements: arr('achievements'), plans: arr('plans'), quotes: arr('quotes'),
      ideas: arr('ideas'), lessons: arr('lessons'), challenges: arr('challenges'),
      people: arr('people'), places: arr('places'), events: arr('events'), moments: arr('moments')
    };
  }catch(e){ console.error('life extraction JSON parse failed', e); return null; }
}

// De-dupe an array of {text:...} items by normalized text — mirrors the
// "prevent obvious duplicates within the same journal" requirement.
function dedupeByText(arr){
  const seen = new Set(), out = [];
  (arr||[]).forEach(x=>{
    const key = ((x && x.text) || '').trim().toLowerCase();
    if(!key || seen.has(key)) return;
    seen.add(key); out.push(x);
  });
  return out;
}
function normalizeName(n){ return (n||'').trim().toLowerCase().replace(/\s+/g,' '); }
function isISODate(s){ return typeof s==='string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }

// Deletes this journal's existing derived docs in `colName` and writes the
// fresh set — this is the "update, don't append" behavior Module 06 requires
// when a journal is edited and re-analyzed.
async function replaceSimpleType(batch, colName, entry, items){
  const col = lifeColRef(colName);
  const existing = await col.where('sourceEntryId','==', entry.id).get();
  existing.forEach(d=>batch.delete(d.ref));
  items.forEach(item=>{
    const ref = col.doc();
    batch.set(ref, {
      ...item, favorite: false,
      sourceEntryId: entry.id, sourceDate: entry.date,
      createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
    });
  });
}
// Plans get special handling: re-analysis must NEVER silently flip a plan to
// "Completed" — status (and any user edits/favorite) survive across re-extraction
// for a plan whose text still matches, by normalized text within this journal.
async function replacePlans(batch, entry, rawItems){
  const col = lifeColRef('plans');
  const existing = await col.where('sourceEntryId','==', entry.id).get();
  const priorByText = {};
  existing.forEach(d=>{ priorByText[(d.data().text||'').trim().toLowerCase()] = d.data(); });
  existing.forEach(d=>batch.delete(d.ref));
  dedupeByText(rawItems).forEach(x=>{
    const text = (x.text||'').trim(); if(!text) return;
    const prior = priorByText[text.toLowerCase()];
    const ref = col.doc();
    batch.set(ref, {
      text,
      plannedDate: prior ? (prior.plannedDate||'') : (isISODate(x.plannedDate) ? x.plannedDate : ''),
      status: prior ? (prior.status||'Planned') : 'Planned',
      favorite: prior ? !!prior.favorite : false,
      sourceEntryId: entry.id, sourceDate: entry.date,
      createdAt: prior ? (prior.createdAt || new Date().toISOString()) : new Date().toISOString(),
      updatedAt: new Date().toISOString()
    });
  });
}
async function replaceEvents(batch, entry, rawItems){
  const col = lifeColRef('events');
  const existing = await col.where('sourceEntryId','==', entry.id).get();
  existing.forEach(d=>batch.delete(d.ref));
  const seen = new Set();
  (rawItems||[]).forEach(x=>{
    const title = ((x && x.title) || '').trim(); if(!title) return;
    const key = title.toLowerCase(); if(seen.has(key)) return; seen.add(key);
    const ref = col.doc();
    batch.set(ref, {
      title,
      date: isISODate(x.date) ? x.date : entry.date,
      relatedPeople: Array.isArray(x.relatedPeople) ? x.relatedPeople.map(p=>(p||'').trim()).filter(Boolean).slice(0,10) : [],
      relatedPlace: (x.relatedPlace||'').trim(),
      sourceEntryId: entry.id, sourceDate: entry.date,
      createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
    });
  });
}
// People/Places aggregate across journals. A mention here updates
// first/lastMentioned + the source journal list; a journal that no longer
// mentions a person (after an edit) is unlinked, and the entity is only
// ever deleted once NO journal supports it anymore — never orphaned.
async function mergeEntities(batch, colName, entry, names){
  const col = lifeColRef(colName);
  const current = state.life[colName] || [];
  const uniqueNames = [...new Set((names||[]).map(n=>(n||'').trim()).filter(Boolean))];
  const stillMentioned = new Set(uniqueNames.map(normalizeName));

  current.forEach(item=>{
    const wasLinked = (item.sourceEntryIds||[]).includes(entry.id);
    if(wasLinked && !stillMentioned.has(normalizeName(item.name))){
      const ids = (item.sourceEntryIds||[]).filter(x=>x!==entry.id);
      const ref = col.doc(item.id);
      if(ids.length===0) batch.delete(ref);
      else batch.set(ref, {sourceEntryIds:ids, mentionCount:ids.length, updatedAt:new Date().toISOString()}, {merge:true});
    }
  });

  uniqueNames.forEach(name=>{
    const norm = normalizeName(name);
    const match = current.find(p=>normalizeName(p.name)===norm);
    if(match){
      const ids = new Set(match.sourceEntryIds||[]);
      ids.add(entry.id);
      const first = match.firstMentioned ? (match.firstMentioned < entry.date ? match.firstMentioned : entry.date) : entry.date;
      const last = match.lastMentioned ? (match.lastMentioned > entry.date ? match.lastMentioned : entry.date) : entry.date;
      batch.set(col.doc(match.id), {
        firstMentioned:first, lastMentioned:last,
        sourceEntryIds:Array.from(ids), mentionCount:ids.size,
        updatedAt:new Date().toISOString()
      }, {merge:true});
    } else {
      batch.set(col.doc(), {
        name, firstMentioned:entry.date, lastMentioned:entry.date,
        sourceEntryIds:[entry.id], mentionCount:1, notes:'',
        createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()
      });
    }
  });
}
async function applyLifeExtraction(entry, parsed){
  const batch = db.batch();
  await replaceSimpleType(batch, 'achievements', entry, dedupeByText(parsed.achievements).map(x=>({
    text:(x.text||'').trim(), category: LIFE_TYPES.achievements.categories.includes(x.category) ? x.category : null
  })).filter(x=>x.text));
  await replaceSimpleType(batch, 'quotes', entry, dedupeByText(parsed.quotes).map(x=>({text:(x.text||'').trim()})).filter(x=>x.text));
  await replaceSimpleType(batch, 'lessons', entry, dedupeByText(parsed.lessons).map(x=>({text:(x.text||'').trim(), context:(x.context||'').trim()})).filter(x=>x.text));
  await replaceSimpleType(batch, 'challenges', entry, dedupeByText(parsed.challenges).map(x=>({text:(x.text||'').trim()})).filter(x=>x.text));
  await replaceSimpleType(batch, 'moments', entry, dedupeByText(parsed.moments).map(x=>({text:(x.text||'').trim(), reason:(x.reason||'').trim()})).filter(x=>x.text));
  await replaceSimpleType(batch, 'ideas', entry, dedupeByText(parsed.ideas).map(x=>({
    text:(x.text||'').trim(), category: LIFE_TYPES.ideas.categories.includes(x.category) ? x.category : null
  })).filter(x=>x.text));
  await replacePlans(batch, entry, parsed.plans);
  await replaceEvents(batch, entry, parsed.events);
  await mergeEntities(batch, 'people', entry, (parsed.people||[]).map(p=>p && p.name));
  await mergeEntities(batch, 'places', entry, (parsed.places||[]).map(p=>p && p.name));
  await batch.commit();
}
async function runLifeExtraction(entry){
  if(!state.user || !entry || !entry.id) return;
  if(!state.settings || state.settings.aiExtraction===false) return; // user opted out in Settings
  if(!state.settings.apiKey) return; // no Gemini key — nothing reliable to extract into Life Organization
  try{
    const raw = await callGemini(buildLifeExtractionPrompt(entry));
    const parsed = parseLifeExtractionJSON(raw);
    if(!parsed) return; // garbled/failed AI call — never wipe existing derived data
    await applyLifeExtraction(entry, parsed);
  }catch(err){ console.error('runLifeExtraction failed', err); }
}
// Called when a journal is permanently deleted — its derived data must never
// become orphaned, so every simple item is removed and every Person/Place
// loses this journal's mention (and is itself removed once no journal backs it).
async function cascadeDeleteLifeData(entryId){
  try{
    const batch = db.batch();
    const simple = ['achievements','plans','quotes','ideas','lessons','challenges','moments','events'];
    for(const name of simple){
      const snap = await lifeColRef(name).where('sourceEntryId','==', entryId).get();
      snap.forEach(d=>batch.delete(d.ref));
    }
    ['people','places'].forEach(name=>{
      (state.life[name]||[]).forEach(item=>{
        if((item.sourceEntryIds||[]).includes(entryId)){
          const ids = item.sourceEntryIds.filter(x=>x!==entryId);
          const ref = lifeColRef(name).doc(item.id);
          if(ids.length===0) batch.delete(ref);
          else batch.set(ref, {sourceEntryIds:ids, mentionCount:ids.length, updatedAt:new Date().toISOString()}, {merge:true});
        }
      });
    });
    await batch.commit();
  }catch(err){ console.error('cascadeDeleteLifeData failed', err); }
}

/* ================================================================
   MODULE 07 — TIME-BASED INSIGHTS & ANALYTICS
   ----------------------------------------------------------------
   Architecture: Journal Entries -> (Module 05/06 structured data) ->
   this local analytics engine -> Insights UI. All BASIC statistics
   here are computed purely from state.entries / state.life in the
   browser — zero AI calls, always available, always fast, always
   correct even with zero Gemini key. AI is layered on top only for
   the reflective/narrative + pattern-detection sections, and is
   cached in Firestore (users/{uid}/analytics/*) so it is generated
   on request, not on every render (see PERIOD ANALYSIS CACHE below).
   ================================================================ */

const PERIODS = [
  {key:'7d', label:'7D', days:7},
  {key:'30d', label:'30D', days:30},
  {key:'3m', label:'3M', days:90},
  {key:'6m', label:'6M', days:182},
  {key:'1y', label:'1Y', days:365},
  {key:'all', label:'All', days:null}
];
function periodRange(key){
  const now = new Date(); now.setHours(23,59,59,999);
  const p = PERIODS.find(x=>x.key===key) || PERIODS[1];
  if(!p.days) return {start:null, end:now};
  const start = new Date(now); start.setDate(start.getDate() - p.days + 1); start.setHours(0,0,0,0);
  return {start, end:now};
}
// Previous equivalent period, for comparisons (e.g. this 30d vs prior 30d).
function previousPeriodRange(key){
  const {start} = periodRange(key);
  if(!start) return {start:null, end:null}; // "all" has no meaningful predecessor
  const p = PERIODS.find(x=>x.key===key);
  const prevEnd = new Date(start); prevEnd.setDate(prevEnd.getDate()-1); prevEnd.setHours(23,59,59,999);
  const prevStart = new Date(prevEnd); prevStart.setDate(prevStart.getDate() - p.days + 1); prevStart.setHours(0,0,0,0);
  return {start:prevStart, end:prevEnd};
}
function entriesInRange(entries, start, end){
  return entries.filter(e=>{
    if(e.archived) return false;
    const d = new Date(e.date+'T12:00:00');
    if(start && d < start) return false;
    if(end && d > end) return false;
    return true;
  });
}
function wordCount(text){ return (text||'').trim() ? (text||'').trim().split(/\s+/).filter(Boolean).length : 0; }

// ---- Streak helpers reusable for any date set (not just "today back") ----
function computeStreaksFromDates(dateSet){
  const dates = Array.from(dateSet).sort();
  if(!dates.length) return {longest:0, current:0};
  let longest=1, run=1;
  for(let i=1;i<dates.length;i++){
    const prev = new Date(dates[i-1]+'T00:00:00'), cur = new Date(dates[i]+'T00:00:00');
    const diffDays = Math.round((cur-prev)/86400000);
    run = diffDays===1 ? run+1 : 1;
    if(run>longest) longest = run;
  }
  return {longest, current:getStreak()};
}

// ---- Core writing/mood analytics for a set of entries within [start,end] ----
function computeCoreStats(entries){
  const total = entries.length;
  const words = entries.map(e=>wordCount(e.content));
  const totalWords = words.reduce((a,b)=>a+b,0);
  const avgWords = total ? Math.round(totalWords/total) : 0;
  const longest = total ? Math.max(...words) : 0;
  const shortest = total ? Math.min(...words) : 0;
  const activeDays = new Set(entries.map(e=>e.date));
  const dayCount = activeDays.size;

  // consistency: active days / calendar days spanned by the entries themselves
  let consistency = 0;
  if(dayCount>1){
    const sorted = Array.from(activeDays).sort();
    const span = Math.round((new Date(sorted[sorted.length-1]+'T00:00:00') - new Date(sorted[0]+'T00:00:00'))/86400000) + 1;
    consistency = span>0 ? Math.round((dayCount/span)*100) : 100;
  } else if(dayCount===1){ consistency = 100; }

  const weeksSpanned = dayCount ? Math.max(1, Math.ceil((entries.length ? (()=>{
    const sorted = Array.from(activeDays).sort();
    return (new Date(sorted[sorted.length-1]+'T00:00:00') - new Date(sorted[0]+'T00:00:00'))/86400000 + 1;
  })() : 7)/7)) : 1;
  const avgEntriesPerWeek = total ? +(total/weeksSpanned).toFixed(1) : 0;

  const streaks = computeStreaksFromDates(activeDays);

  // mood distribution + intensity
  const moodCount = {}; MOODS.forEach(m=>moodCount[m.id]=0);
  let intensitySum=0, intensityN=0, intensityMax=null, intensityMin=null;
  const moodWords = {}; MOODS.forEach(m=>moodWords[m.id]={sum:0,n:0});
  entries.forEach(e=>{
    if(moodCount[e.mood]===undefined) moodCount[e.mood]=0;
    moodCount[e.mood]++;
    const wc = wordCount(e.content);
    if(moodWords[e.mood]){ moodWords[e.mood].sum += wc; moodWords[e.mood].n++; }
    if(typeof e.moodIntensity==='number'){
      intensitySum += e.moodIntensity; intensityN++;
      intensityMax = intensityMax===null ? e.moodIntensity : Math.max(intensityMax, e.moodIntensity);
      intensityMin = intensityMin===null ? e.moodIntensity : Math.min(intensityMin, e.moodIntensity);
    }
  });
  const avgIntensity = intensityN ? +(intensitySum/intensityN).toFixed(1) : null;

  // most active day / week / month + highest word-count period, from actual data
  const byDay = {}; entries.forEach(e=>{ byDay[e.date] = (byDay[e.date]||0)+1; });
  const mostActiveDay = Object.entries(byDay).sort((a,b)=>b[1]-a[1])[0] || null;
  const byWeek = {}, wordsByWeek = {};
  entries.forEach(e=>{
    const wk = isoWeekKey(e.date);
    byWeek[wk] = (byWeek[wk]||0)+1;
    wordsByWeek[wk] = (wordsByWeek[wk]||0) + wordCount(e.content);
  });
  const mostActiveWeek = Object.entries(byWeek).sort((a,b)=>b[1]-a[1])[0] || null;
  const byMonth = {}, wordsByMonth = {};
  entries.forEach(e=>{
    const mk = e.date.slice(0,7);
    byMonth[mk] = (byMonth[mk]||0)+1;
    wordsByMonth[mk] = (wordsByMonth[mk]||0) + wordCount(e.content);
  });
  const mostActiveMonth = Object.entries(byMonth).sort((a,b)=>b[1]-a[1])[0] || null;
  const highestWordWeek = Object.entries(wordsByWeek).sort((a,b)=>b[1]-a[1])[0] || null;

  return {
    total, totalWords, avgWords, longest, shortest, dayCount, consistency, avgEntriesPerWeek,
    longestStreak: streaks.longest, currentStreak: streaks.current,
    moodCount, avgIntensity, intensityMax, intensityMin, moodWords,
    mostActiveDay, mostActiveWeek, mostActiveMonth, highestWordWeek
  };
}
function isoWeekKey(dateISO){
  const d = new Date(dateISO+'T00:00:00');
  const day = (d.getDay()+6)%7; // Mon=0
  d.setDate(d.getDate()-day);
  return d.toISOString().slice(0,10); // Monday of that week, as a stable key
}

// ---- Activity trend buckets (daily/weekly/monthly depending on span) ----
function activityTrend(entries, periodKey){
  const granularity = (periodKey==='7d'||periodKey==='30d') ? 'day' : (periodKey==='3m'||periodKey==='6m') ? 'week' : 'month';
  const buckets = {};
  entries.forEach(e=>{
    const key = granularity==='day' ? e.date : granularity==='week' ? isoWeekKey(e.date) : e.date.slice(0,7);
    if(!buckets[key]) buckets[key] = {entries:0, words:0};
    buckets[key].entries++;
    buckets[key].words += wordCount(e.content);
  });
  const keys = Object.keys(buckets).sort();
  return {granularity, points: keys.map(k=>({key:k, ...buckets[k]}))};
}
// Mood trend over the same buckets — dominant mood + avg intensity per bucket.
function moodTrend(entries, periodKey){
  const granularity = (periodKey==='7d'||periodKey==='30d') ? 'day' : (periodKey==='3m'||periodKey==='6m') ? 'week' : 'month';
  const buckets = {};
  entries.forEach(e=>{
    const key = granularity==='day' ? e.date : granularity==='week' ? isoWeekKey(e.date) : e.date.slice(0,7);
    if(!buckets[key]) buckets[key] = {counts:{}, intSum:0, intN:0};
    buckets[key].counts[e.mood] = (buckets[key].counts[e.mood]||0)+1;
    if(typeof e.moodIntensity==='number'){ buckets[key].intSum += e.moodIntensity; buckets[key].intN++; }
  });
  const keys = Object.keys(buckets).sort();
  return {granularity, points: keys.map(k=>{
    const b = buckets[k];
    const dominant = Object.entries(b.counts).sort((a,b2)=>b2[1]-a[1])[0];
    return {key:k, dominant: dominant ? dominant[0] : null, avgIntensity: b.intN ? +(b.intSum/b.intN).toFixed(1) : null};
  })};
}

// ---- Life Organization counts for a period (Module 06 data, filtered by sourceDate) ----
function lifeCountsInRange(start, end){
  const inRange = (d)=>{
    if(!d) return false;
    const dt = new Date(d+'T12:00:00');
    if(start && dt<start) return false;
    if(end && dt>end) return false;
    return true;
  };
  const life = state.life || {};
  return {
    achievements: (life.achievements||[]).filter(x=>inRange(x.sourceDate)).length,
    plans: (life.plans||[]).filter(x=>inRange(x.sourceDate)).length,
    challenges: (life.challenges||[]).filter(x=>inRange(x.sourceDate)).length,
    ideas: (life.ideas||[]).filter(x=>inRange(x.sourceDate)).length,
    lessons: (life.lessons||[]).filter(x=>inRange(x.sourceDate)).length,
    moments: (life.moments||[]).filter(x=>inRange(x.sourceDate)).length,
    quotes: (life.quotes||[]).filter(x=>inRange(x.sourceDate)).length,
    events: (life.events||[]).filter(x=>inRange(x.sourceDate)).length
  };
}

// ---- Full analytics bundle for a given period key, used by the Insights page ----
function computeAnalytics(periodKey){
  const activeEntries = state.entries.filter(e=>!e.archived);
  const {start, end} = periodRange(periodKey);
  const inPeriod = entriesInRange(activeEntries, start, end);
  const core = computeCoreStats(inPeriod);
  const trend = activityTrend(inPeriod, periodKey);
  const mTrend = moodTrend(inPeriod, periodKey);
  const life = lifeCountsInRange(start, end);

  let comparison = null;
  if(periodKey!=='all'){
    const prev = previousPeriodRange(periodKey);
    if(prev.start){
      const prevEntries = entriesInRange(activeEntries, prev.start, prev.end);
      if(prevEntries.length>0 || inPeriod.length>0){
        const prevCore = computeCoreStats(prevEntries);
        comparison = { current: core, previous: prevCore,
          hasEnoughData: prevEntries.length>0,
          pct: (a,b)=> b>0 ? Math.round(((a-b)/b)*100) : (a>0 ? 100 : 0) };
      }
    }
  }
  return {periodKey, start, end, entries:inPeriod, core, trend, mTrend, life, comparison};
}

/* ---------------- PERIOD ANALYSIS CACHE (Firestore-backed AI layer) ----------------
   AI reflections/patterns are expensive and must NOT be regenerated on every
   Insights render (Module 07 requirement). Each cached doc carries status
   (idle/generating/ready/failed), generatedAt, and the entry count it was
   built from — so we know to offer "Regenerate" rather than silently reuse
   stale analysis after new journals are written, without ever auto-firing
   another Gemini call on our own. */
function analyticsColRef(){ return userDocRef().collection('analytics'); }
function patternsDocRef(){ return userDocRef().collection('analytics').doc('patterns'); }

function weeklyPeriodId(d){ return 'weekly_' + isoWeekKey(d.toISOString().slice(0,10)); }
function monthlyPeriodId(d){ return 'monthly_' + d.toISOString().slice(0,7); }
function yearlyPeriodId(y){ return 'yearly_' + y; }

async function loadCachedAnalysis(periodId){
  if(state.analysisCache[periodId]) return state.analysisCache[periodId];
  if(!state.user) return null;
  try{
    const doc = await analyticsColRef().doc(periodId).get();
    const data = doc.exists ? doc.data() : {status:'idle'};
    state.analysisCache[periodId] = data;
    return data;
  }catch(err){ console.error('loadCachedAnalysis failed', err); return {status:'failed'}; }
}
async function saveCachedAnalysis(periodId, data){
  state.analysisCache[periodId] = data;
  if(!state.user) return;
  try{ await analyticsColRef().doc(periodId).set(data, {merge:true}); }
  catch(err){ console.error('saveCachedAnalysis failed', err); }
}

// Builds a compact, structured (not raw-dump) context from Module 05/06 data
// for a date range, so AI prompts summarize facts rather than re-reading
// full journal text wherever structured data already exists.
function buildStructuredContext(start, end, entries){
  const inRange = (d)=>{
    if(!d) return false; const dt = new Date(d+'T12:00:00');
    return (!start || dt>=start) && (!end || dt<=end);
  };
  const life = state.life || {};
  const pick = (arr, mapFn, limit)=> (arr||[]).filter(x=>inRange(x.sourceDate)).slice(0,limit||25).map(mapFn);
  return {
    entryCount: entries.length,
    moodCounts: (()=>{ const c={}; entries.forEach(e=>c[e.mood]=(c[e.mood]||0)+1); return c; })(),
    avgIntensity: (()=>{ const vals=entries.filter(e=>typeof e.moodIntensity==='number').map(e=>e.moodIntensity);
      return vals.length ? +(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1) : null; })(),
    achievements: pick(life.achievements, x=>x.text),
    plans: pick(life.plans, x=>`${x.text}${x.status?' ('+x.status+')':''}`),
    challenges: pick(life.challenges, x=>x.text),
    ideas: pick(life.ideas, x=>x.text),
    lessons: pick(life.lessons, x=>x.text),
    moments: pick(life.moments, x=>x.text),
    entries: entries.slice(0,60).map(e=>({date:e.date, mood:e.mood, intensity:e.moodIntensity, excerpt:(e.content||'').slice(0,300)}))
  };
}

Structured data (JSON):
${JSON.stringify(ctx).slice(0,10000)}`;

  const raw = await callGemini(prompt);

// ---- Pattern detection (Module 07 §12-14): cached, source-traceable ----
async function generatePatterns(){
  state.patternsCache = {status:'generating'};
  if(!state.settings || !state.settings.apiKey){
    state.patternsCache = {status:'failed', reason:'no-key'};
    await patternsDocRef().set(state.patternsCache, {merge:true}).catch(()=>{});
    return state.patternsCache;
  }
  const activeEntries = state.entries.filter(e=>!e.archived).sort((a,b)=>a.date.localeCompare(b.date));
  if(activeEntries.length<3){
    state.patternsCache = {status:'failed', reason:'no-data'};
    await patternsDocRef().set(state.patternsCache, {merge:true}).catch(()=>{});
    return state.patternsCache;
  }
  const ctx = buildStructuredContext(null, null, activeEntries.slice(-120)); // most recent 120 entries is plenty signal, keeps prompt bounded
  const prompt = `তুমি একজন সতর্ক প্যাটার্ন-বিশ্লেষক। নিচের ডায়েরি ডেটা থেকে পুনরাবৃত্ত (recurring) প্যাটার্ন খুঁজে বের করো — যেমন recurring topics, moods, challenges, goals, repeated people/places, writing frequency পরিবর্তন, ইত্যাদি।

কড়া নিয়ম:
- প্রতিটি প্যাটার্ন অন্তত ২টি ভিন্ন জার্নাল এন্ট্রি দ্বারা সমর্থিত হতে হবে (তারিখসহ)।
- কোনো মেডিক্যাল/সাইকোলজিক্যাল নির্ণয় বা ব্যক্তিত্ব সংক্রান্ত সিদ্ধান্ত কখনো দিও না (যেমন "you are an anxious person")। শুধু observable pattern লেখো।
- প্রতিটি প্যাটার্নে confidence দাও: "High" (অনেক এন্ট্রি সমর্থন করে), "Medium", বা "Low" — evidence-এর পরিমাণের ভিত্তিতে, নিজের মতামত অনুযায়ী নয়।
- শুধু JSON আউটপুট দাও, markdown fence বা অন্য কিছু নয়। স্কিমা:
{"patterns":[{"title":"","description":"","confidence":"High|Medium|Low","sourceDates":["YYYY-MM-DD"]}]}

Structured data (JSON):
${JSON.stringify(ctx).slice(0,12000)}`;

  const raw = await callGemini(prompt);
  let parsed = null;
  if(raw){
    try{
      let t = raw.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
      const first=t.indexOf('{'), last=t.lastIndexOf('}');
      if(first!==-1 && last!==-1) parsed = JSON.parse(t.slice(first,last+1));
    }catch(e){ console.error('pattern JSON parse failed', e); }
  }
  if(!parsed || !Array.isArray(parsed.patterns)){
    state.patternsCache = {status:'failed', reason:'api-error'};
    await patternsDocRef().set(state.patternsCache, {merge:true}).catch(()=>{});
    return state.patternsCache;
  }
  const patterns = parsed.patterns.map(p=>({
    title: (p.title||'').trim(),
    description: (p.description||'').trim(),
    confidence: ['High','Medium','Low'].includes(p.confidence) ? p.confidence : 'Low',
    sourceDates: Array.isArray(p.sourceDates) ? p.sourceDates.filter(isISODate) : []
  })).filter(p=>p.title && p.description);
  state.patternsCache = {status:'ready', patterns, generatedAt: new Date().toISOString(), entryCountAtGeneration: activeEntries.length};
  await patternsDocRef().set(state.patternsCache, {merge:true}).catch(err=>console.error('save patterns failed', err));
  return state.patternsCache;
}

/* ---------------- MODULE 02: DRAFT / AUTOSAVE ---------------- */
function draftDocRef(){ return userDocRef().collection('meta').doc('draft'); }
function draftLSKey(){ return 'journalos_draft_' + (state.user ? state.user.uid : 'anon'); }
function readLocalDraft(){
  try{ const raw = localStorage.getItem(draftLSKey()); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function writeLocalDraft(d){ try{ localStorage.setItem(draftLSKey(), JSON.stringify(d)); }catch(e){} }
function clearLocalDraft(){ try{ localStorage.removeItem(draftLSKey()); }catch(e){} }
let draftFirestoreDebounce = null;
function persistDraftToFirestore(d){
  clearTimeout(draftFirestoreDebounce);
  draftFirestoreDebounce = setTimeout(()=>{
    if(!state.user) return;
    draftDocRef().set(d).catch(err=>console.error('draft save failed', err));
  }, 3000); // debounced — avoids a Firestore write on every keystroke
}
async function clearRemoteDraft(){
  clearTimeout(draftFirestoreDebounce);
  if(!state.user) return;
  try{ await draftDocRef().delete(); }catch(e){ /* fine if it never existed */ }
}
function isDraftMeaningful(d){
  if(!d) return false;
  return !!((d.title && d.title.trim()) || (d.content && d.content.trim().length>3) || (d.tags && d.tags.length));
}
async function seedDraftFromRemoteIfNeeded(){
  if(!state.user || readLocalDraft()) return; // local already covers this device
  try{
    const snap = await draftDocRef().get();
    if(snap.exists){
      const d = snap.data();
      if(isDraftMeaningful(d)) writeLocalDraft(d);
    }
  }catch(err){ console.error('draft fetch failed', err); }
}
let autosaveIndicatorTimer = null;
function scheduleAutosave(){
  if(!window.__draft) return;
  const snapshot = {...window.__draft, entryId: window.__draft.id || null, savedAt: new Date().toISOString()};
  delete snapshot.id;
  if(!isDraftMeaningful(snapshot)){ clearLocalDraft(); return; } // never persist an empty draft
  writeLocalDraft(snapshot);
  showDraftStatus('saving');
  persistDraftToFirestore(snapshot);
  clearTimeout(autosaveIndicatorTimer);
  autosaveIndicatorTimer = setTimeout(()=> showDraftStatus('saved', snapshot.savedAt), 600);
}
function showDraftStatus(mode, savedAt){
  const el = document.getElementById('draftStatus');
  if(!el) return;
  if(mode==='saving'){ el.textContent='Saving draft…'; el.classList.add('saving'); }
  else{ el.textContent='Draft saved '+new Date(savedAt||Date.now()).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); el.classList.remove('saving'); }
}
function timeAgo(iso){
  const diff = Math.max(0, Date.now() - new Date(iso).getTime());
  const mins = Math.round(diff/60000);
  if(mins < 1) return 'একটু আগে';
  if(mins < 60) return mins + ' মিনিট আগে';
  const hrs = Math.round(mins/60);
  if(hrs < 24) return hrs + ' ঘন্টা আগে';
  return new Date(iso).toLocaleDateString();
}
function continueDraft(){
  const d = window.__pendingRecoveryDraft;
  if(!d) return;
  // Stash the recovered fields on state (not window.__draft) — renderWrite() runs again
  // right after this and rebuilds window.__draft from scratch, so it needs a place to
  // read the recovered content back from *while* building that object, not after.
  state.appliedDraftData = {...d};
  state.draftRecoveryResolved = true;
  render();
}
function discardDraftRecovery(){
  clearLocalDraft();
  clearRemoteDraft();
  state.draftRecoveryResolved = true;
  state.appliedDraftData = null;
  window.__pendingRecoveryDraft = null;
  render();
}
function cancelWrite(){
  clearLocalDraft();
  clearRemoteDraft();
  state.appliedDraftData = null;
  go('dashboard');
}

function boot(){

  document.documentElement.setAttribute('data-theme', localStorage.getItem(THEME_CACHE_KEY) || 'light');
  syncThemeChipIcon();

  document.body.classList.toggle('sb-expanded', sbExpanded);
