<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#080C16">
<title>JournalOS Control Center</title>
<link rel="icon" href="/assets/favicon-32.png">
<link rel="stylesheet" href="/admin/admin.css?v=1">
</head>
<body>

<!-- ===== gates ===== -->
<div class="gate" id="gLoad"><div class="gate-card"><div class="logo-orb">J</div><h1>Control Center</h1><p>লোড হচ্ছে…</p><div class="skel" style="width:60%;margin:0 auto"></div></div></div>

<div class="gate hide" id="gLogin"><div class="gate-card">
  <div class="logo-orb">J</div><h1>JournalOS Control Center</h1>
  <p>শুধু অ্যাডমিনদের জন্য। Google অ্যাকাউন্ট দিয়ে সাইন-ইন করো।</p>
  <div class="err" id="loginErr"></div>
  <button class="btn pri" style="width:100%;height:46px" id="btnGoogle">Google দিয়ে সাইন-ইন</button>
  <p class="sm muted" style="margin:16px 0 0"><a href="/app/">← অ্যাপে ফিরে যাও</a></p>
</div></div>

<div class="gate hide" id="gDeny"><div class="gate-card">
  <div class="logo-orb" style="background:linear-gradient(135deg,#d6405a,#f2b53c)">!</div><h1>অ্যাক্সেস নেই</h1>
  <p id="denyMsg"></p>
  <button class="btn" onclick="A.signOut()">অন্য অ্যাকাউন্টে সাইন-ইন</button>
</div></div>

<div class="gate hide" id="gPin"><div class="gate-card">
  <div class="logo-orb">🔐</div><h1>Admin passcode</h1>
  <p>চালিয়ে যেতে ব্যাকএন্ড পাসকোড দাও।</p>
  <div class="pin"><input id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="24" aria-label="Passcode"></div>
  <div class="err" id="pinErr"></div>
  <button class="btn pri" style="width:100%;height:44px" id="pinGo">আনলক</button>
  <p class="sm muted" style="margin:16px 0 0"><span id="pinWho"></span> · <a href="#" onclick="A.signOut();return false">সাইন-আউট</a></p>
</div></div>

<!-- ===== shell ===== -->
<div class="shell hide" id="shell">
  <aside class="side" id="side">
    <div class="brand-row"><div class="logo-orb">J</div><div><b id="sbName">JournalOS</b><small>Control Center</small></div></div>
    <nav class="nav" id="nav" aria-label="Backend"></nav>
    <div class="side-foot">
      <button onclick="A.toggleMini()" title="Collapse sidebar"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg><span>Collapse</span></button>
      <button onclick="A.lock()" title="Lock"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg><span>Lock</span></button>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="icon-btn menu-btn" onclick="A.toggleSide()" aria-label="Menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="crumb"><small id="crGroup">Overview</small><b id="crTitle">Dashboard</b></div>
      <div class="top-sp"></div>
      <button class="kbd-btn" onclick="A.cmdk(true)" aria-label="Search & commands"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>Search or jump to…</span><kbd>Ctrl K</kbd></button>
      <div class="relw">
        <button class="icon-btn" id="bellBtn" onclick="A.pop('bellPop')" aria-label="Notifications"><svg class="i" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 004 0"/></svg><span class="dot hide" id="bellDot">0</span></button>
        <div class="pop" id="bellPop"></div>
      </div>
      <button class="icon-btn" onclick="A.toggleTheme()" aria-label="Theme"><svg class="i" viewBox="0 0 24 24"><path d="M21 13.2A8.5 8.5 0 1110.8 3a6.8 6.8 0 0010.2 10.2z"/></svg></button>
      <div class="relw">
        <button class="me" onclick="A.pop('mePop')"><i id="meAv">A</i><span id="meName">Admin</span></button>
        <div class="pop" id="mePop"></div>
      </div>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>

<div class="scrim" id="scrim" onclick="A.closeAll()"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="cmdk" id="cmdk" role="dialog" aria-label="Command palette"><input id="cmdIn" placeholder="পেজ, ইউজার বা কাজ খোঁজো…" autocomplete="off"><div class="cmdk-l" id="cmdL"></div></div>
<div id="toasts" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="/assets/site-config.js"></script>
<script src="/admin/core.js?v=1"></script>
<script src="/admin/pages-a.js?v=1"></script>
<script src="/admin/pages-b.js?v=1"></script>
<script src="/admin/pages-c.js?v=1"></script>
<script>A.boot();</script>
</body>
</html>
